<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7a55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bijak Kewangan">
<link rel="manifest" href="manifest.webmanifest">
<title>Apps Bijak Kewangan Lukman</title>
<style>
:root{
  --bg:#f3f6f4; --card:#ffffff; --ink:#13201a; --muted:#66756d; --line:#e2e9e5;
  --brand:#0f7a55; --brand2:#2fb47f; --brand-soft:#e6f4ee; --danger:#c8423b; --warn:#c98a12;
  --field:#eef3f0; --shadow:0 6px 24px rgba(16,40,30,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1512; --card:#15211c; --ink:#e7f0eb; --muted:#93a59b; --line:#24342d;
  --brand:#2fb47f; --brand2:#5fd6a3; --brand-soft:#1a3a2d; --field:#1c2b24; --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0d1512; --card:#15211c; --ink:#e7f0eb; --muted:#93a59b; --line:#24342d;
  --brand:#2fb47f; --brand2:#5fd6a3; --brand-soft:#1a3a2d; --field:#1c2b24; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:14px 16px 0;max-width:720px;margin:0 auto}
.brandrow{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.brandtxt{flex:1;min-width:0}
.brandtxt b{display:block;font-size:15px;line-height:1.25;letter-spacing:.01em}
.brandtxt small{color:var(--muted)}
.sel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;flex:none}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 18px;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.eyebrow{color:var(--brand);letter-spacing:.14em;font-size:12px;font-weight:700;text-transform:uppercase;margin:20px 0 4px}
h1{font-size:28px;margin:0 0 4px}
h2{font-size:20px;margin:28px 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
.monthnav{display:flex;gap:10px;align-items:center;margin:16px 0}
.monthnav button{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px}
.monthnav .m{flex:1;text-align:center;background:var(--brand-soft);border-radius:14px;padding:13px;font-weight:600;color:var(--muted)}
.monthnav .m::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--brand);margin-right:8px;vertical-align:middle;box-shadow:0 0 0 4px rgba(47,180,127,.2)}
.hero{background:linear-gradient(135deg,#0b5a3f,#159067 60%,#35b985);color:#fff;border-radius:24px;padding:22px;position:relative;overflow:hidden}
.hero.neg{background:linear-gradient(135deg,#7a1f1a,#b53a32 60%,#d9675c)}
.hero small{opacity:.85}
.hero .big{font-size:38px;font-weight:800;margin:6px 0}
.hero .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hero .mini div{background:rgba(255,255,255,.12);border-radius:14px;padding:10px;font-size:12px;min-width:0}
.hero .mini b{display:block;font-size:14px;margin-top:4px;word-break:break-word}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.card .lbl{color:var(--muted);font-size:13px}
.card .val{font-size:22px;font-weight:800;margin:6px 0;word-break:break-word}
.card .note{color:var(--brand);font-size:13px}
.note.bad{color:var(--danger)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.item .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--brand-soft)}
.item .main{flex:1;min-width:0}
.item .main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .main small{color:var(--muted)}
.item .amt{font-weight:700;text-align:right;white-space:nowrap}
.item .amt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.item .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px}
.bar{height:8px;background:var(--field);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand2);border-radius:99px}
.bar i.over{background:var(--danger)}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%;margin-top:12px}
.empty{text-align:center;color:var(--muted);padding:24px;border:1px dashed var(--line);border-radius:16px;margin-top:12px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-weight:600;margin-left:4px}
.pill.bad{background:#fbe5e3;color:var(--danger)}
.chk{width:24px;height:24px;accent-color:var(--brand);flex:none}
/* donut + legend */
.donutwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donutwrap svg{flex:none}
.legend{flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px}
.legend i{width:12px;height:12px;border-radius:4px;flex:none}
.legend span{flex:1}
.legend b{white-space:nowrap}
.cf{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.cf .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.cf .bars{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.cf .bars i{width:42%;max-width:18px;border-radius:6px 6px 2px 2px;display:block;min-height:2px}
.cf small{color:var(--muted);font-size:11px}
.cf .cur small{color:var(--brand);font-weight:700}
.keyrow{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.keyrow i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,15,.45);backdrop-filter:blur(4px);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;border-radius:26px 26px 0 0;display:flex;flex-direction:column}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.sheet .hd b{font-size:20px}
.sheet .bd{padding:8px 20px 12px;overflow-y:auto}
.sheet .ft{display:flex;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet .ft .btn{flex:1}
label.f{display:block;margin-top:12px;color:var(--muted);font-size:14px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:6px;background:var(--field);border:1px solid transparent;border-radius:14px;padding:13px 14px;font-size:16px}
label.f input:focus,label.f select:focus{outline:none;border-color:var(--brand)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc{background:var(--brand-soft);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:14px;line-height:1.6}
.dlg-bg{position:fixed;inset:0;background:rgba(10,20,15,.5);z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
.dlg-bg.on{display:flex}
.dlg{background:var(--card);border-radius:22px;padding:20px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg p{margin:0 0 6px;font-size:16px;line-height:1.45}
.dlg .btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.dlg textarea{width:100%;min-height:160px;margin-top:10px;background:var(--field);border:0;border-radius:12px;padding:10px;font:12px/1.4 ui-monospace,monospace}
.btn.danger{background:var(--danger)}
.demo-banner{background:#fff4dc;color:#7a5400;border-radius:14px;padding:10px 14px;font-size:14px;margin-top:4px;display:flex;gap:10px;align-items:center}
.demo-banner button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;margin-left:auto;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;border:0;background:var(--brand);color:#fff;font-size:28px;box-shadow:0 10px 24px rgba(15,122,85,.35);cursor:pointer;z-index:20}
.seg{display:flex;background:var(--field);border-radius:14px;padding:4px;margin-top:12px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
@media (max-width:420px){
  .brandtxt b{font-size:13px}
  .brandtxt small{font-size:12px}
  .sel{max-width:108px;padding:10px 8px}
  .item{gap:8px;padding:12px 10px}
  .item .dot{width:32px;height:32px;font-size:16px}
  .item .amt{font-size:14px}
  .hero .big{font-size:32px}
  .card .val{font-size:19px}
  h1{font-size:24px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brandrow">
    <div class="logo">BK</div>
    <div class="brandtxt"><b>APPS BIJAK KEWANGAN LUKMAN</b><small>0197784918</small></div>
    <select id="profileSel" class="sel" aria-label="Profil"></select>
    <button class="iconbtn" id="themeBtn" aria-label="Tukar tema">◐</button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="home" class="on">⌂ Utama</button>
    <button data-tab="income">＋ Pendapatan</button>
    <button data-tab="expense">◫ Perbelanjaan</button>
    <button data-tab="debt">▤ Hutang</button>
    <button data-tab="settings">⚙ Tetapan</button>
  </nav>
</header>

<main class="wrap">
  <div class="monthnav">
    <button id="prevM" aria-label="Bulan sebelum">‹</button>
    <div class="m" id="monthLbl"></div>
    <button id="nextM" aria-label="Bulan seterusnya">›</button>
  </div>
  <section id="view"></section>
</main>

<button class="fab" id="fab" aria-label="Tambah">＋</button>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="hd"><b id="sheetTitle"></b><button class="iconbtn" id="sheetClose" aria-label="Tutup">✕</button></div>
    <div class="bd" id="sheetBody"></div>
    <div class="ft"><button class="btn ghost" id="sheetCancel">Batal</button><button class="btn" id="sheetSave">Simpan</button></div>
  </div>
</div>
<div class="dlg-bg" id="dlgBg"><div class="dlg" role="alertdialog" aria-modal="true"><div id="dlgBody"></div><div class="btns" id="dlgBtns"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= DATA ================= */
const KEY = 'perancang-kewangan-v1';
const BANKS = ['Maybank','CIMB','Public Bank','RHB','Hong Leong','AmBank','Bank Islam','Bank Rakyat','BSN','Affin','Alliance','UOB','OCBC','HSBC','Standard Chartered','Agrobank','MBSB','Al Rajhi','GXBank','Boost Bank','AEON Bank','Lain-lain'];
const INCOME_TYPES = {gaji:'Gaji bersih',elaun:'Elaun / OT',bisnes:'Bisnes / sampingan',sewa:'Sewa',dividen:'Dividen / pelaburan',lain:'Lain-lain'};
const CATS = {
  makan:{n:'Makanan & dapur',i:'🍚',c:'#2fb47f'},
  utiliti:{n:'Bil & utiliti',i:'💡',c:'#3b82c4'},
  transport:{n:'Minyak & tol',i:'⛽',c:'#e0912f'},
  rumah:{n:'Sewa / rumah',i:'🏠',c:'#8b5cc4'},
  anak:{n:'Anak & sekolah',i:'🎒',c:'#d9577a'},
  takaful:{n:'Insurans / takaful',i:'🛡️',c:'#1f9aa3'},
  telefon:{n:'Telefon & internet',i:'📱',c:'#5468d6'},
  ibubapa:{n:'Ibu bapa / keluarga',i:'❤️',c:'#c4453b'},
  simpanan:{n:'Simpanan / pelaburan',i:'💰',c:'#b8a21f'},
  hiburan:{n:'Hiburan & langganan',i:'🎬',c:'#9a6b3c'},
  belanja:{n:'Shopping',i:'🛍️',c:'#d46fc0'},
  sedekah:{n:'Zakat / sedekah',i:'🤲',c:'#4c9a5c'},
  lain:{n:'Lain-lain',i:'📦',c:'#8a948f'}
};
const DEBT_KINDS = {
  rumah:{n:'Pinjaman rumah',i:'🏡',g:'loan'},
  kereta:{n:'Pinjaman kereta',i:'🚗',g:'loan'},
  peribadi:{n:'Pinjaman peribadi',i:'💼',g:'loan'},
  ptptn:{n:'PTPTN',i:'🎓',g:'loan'},
  motor:{n:'Pinjaman motor',i:'🏍️',g:'loan'},
  lainloan:{n:'Pinjaman lain',i:'📄',g:'loan'},
  kad:{n:'Kad kredit',i:'💳',g:'card'},
  paylater:{n:'PayLater / ansuran',i:'🛒',g:'card'}
};
const PAYLATER = {
  'Beli Sekarang, Bayar Kemudian':['Shopee SPayLater','Atome','Grab PayLater','Boost PayFlex','TikTok PayLater','Lain-lain PayLater'],
  'Ansuran Kad Kredit':['Maybank EzyPay','CIMB Instalment','Public Bank EPP','RHB Instalment','UOB EPP','Hong Leong Flexi','Lain-lain kad']
};
const PAYMETHOD = ['Tunai','Debit / FPX','eWallet','Kad kredit','PayLater'];

var firstRun=false;
let S = load();
let cur = ym(new Date());
let tab = 'home';

function blankProfile(){return {incomes:[],expenses:[],debts:[],budgets:{},paid:{}}}
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.profiles) return s;}catch(e){}
  firstRun=true;
  return {active:'Suami',theme:'auto',demo:true,profiles:{'Suami':blankProfile(),'Isteri':blankProfile()}};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Gagal simpan (storan penuh?)');}}
const P = () => S.profiles[S.active];
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);

/* ================= UTIL ================= */
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function addM(k,n){const [y,m]=k.split('-').map(Number);return ym(new Date(y,m-1+n,1))}
function mDiff(a,b){const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+(m2-m1)}
const MN=['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
const MS=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
function mLabel(k){const [y,m]=k.split('-').map(Number);return MN[m-1]+' '+y}
function rm(n){n=Number(n)||0;return (n<0?'-':'')+'RM '+Math.abs(n).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})}
function rmShort(n){n=Number(n)||0;const a=Math.abs(n);return a>=1000?(n/1000).toFixed(a>=10000?0:1)+'k':Math.round(n)+''}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const num = v => { const n=parseFloat(String(v).replace(/,/g,'')); return isFinite(n)?n:0; };
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1800)}

// In-page dialog (browser confirm/prompt don't work everywhere). Resolves with the chosen key or null.
function ask(html,buttons,input){
  return new Promise(res=>{
    const bg=document.getElementById('dlgBg');
    document.getElementById('dlgBody').innerHTML=html+(input?`<label class="f"><input id="dlgIn" placeholder="${esc(input)}"></label>`:'');
    const bx=document.getElementById('dlgBtns'); bx.innerHTML='';
    const done=v=>{bg.classList.remove('on');res(v)};
    [...buttons,['__cancel','Batal','ghost']].forEach(([k,l,c])=>{const b=document.createElement('button');b.className='btn '+(c||'');b.textContent=l;
      b.onclick=()=>done(k==='__cancel'?null:(input?(document.getElementById('dlgIn').value.trim()||null):k));bx.appendChild(b)});
    bg.classList.add('on'); if(input) setTimeout(()=>document.getElementById('dlgIn').focus(),50);
  });
}
const sure=(msg,label='Ya',cls='danger')=>ask(`<p>${msg}</p>`,[['ok',label,cls]]).then(v=>v==='ok');

/* ================= CALC ================= */
// Income/expense entries are tied to a month; recurring ones repeat every month from their start month.
function inMonth(e,k){ if(e.recurring) return e.month<=k && (!e.until || k<=e.until); return e.month===k; }
function incomesOf(k){return P().incomes.filter(e=>inMonth(e,k))}
function expensesOf(k){return P().expenses.filter(e=>inMonth(e,k))}
// Debts: monthly instalment from startMonth for `tenure` months (0 = ongoing, e.g. credit card).
function debtEnd(d){return d.tenure>0?addM(d.start,d.tenure-1):null}
function debtActive(d,k){return d.start<=k && (!debtEnd(d) || k<=debtEnd(d))}
function debtRemaining(d,k){
  if(!(d.tenure>0)) return Math.max(0,num(d.balance));
  const paidMonths = Math.max(0,Math.min(d.tenure, mDiff(d.start,k)+1));
  return Math.max(0, d.monthly*(d.tenure-paidMonths));
}
function totals(k){
  const inc=incomesOf(k), exp=expensesOf(k), debts=P().debts.filter(d=>debtActive(d,k));
  const income=inc.reduce((a,e)=>a+num(e.amount),0);
  const salary=inc.filter(e=>e.type==='gaji').reduce((a,e)=>a+num(e.amount),0);
  const expense=exp.reduce((a,e)=>a+num(e.amount),0);
  const loans=debts.filter(d=>DEBT_KINDS[d.kind].g==='loan'), cards=debts.filter(d=>DEBT_KINDS[d.kind].g==='card');
  const loanM=loans.reduce((a,d)=>a+num(d.monthly),0), cardM=cards.reduce((a,d)=>a+num(d.monthly),0);
  const all=P().debts;
  const loanBal=all.filter(d=>DEBT_KINDS[d.kind].g==='loan').reduce((a,d)=>a+debtRemaining(d,k),0);
  const cardBal=all.filter(d=>DEBT_KINDS[d.kind].g==='card').reduce((a,d)=>a+debtRemaining(d,k),0);
  const budget=Object.values(P().budgets).reduce((a,b)=>a+num(b),0);
  const savings=exp.filter(e=>e.cat==='simpanan').reduce((a,e)=>a+num(e.amount),0);
  return {inc,exp,debts,income,salary,expense,loanM,cardM,debtM:loanM+cardM,loanBal,cardBal,budget,savings,balance:income-expense-loanM-cardM};
}

/* ================= RENDER ================= */
function render(){
  document.getElementById('monthLbl').textContent=mLabel(cur);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const ps=document.getElementById('profileSel');
  ps.innerHTML=Object.keys(S.profiles).map(n=>`<option ${n===S.active?'selected':''}>${esc(n)}</option>`).join('');
  document.getElementById('fab').style.display = ['income','expense','debt'].includes(tab)?'block':'none';
  const v=document.getElementById('view');
  v.innerHTML = ({home:viewHome,income:viewIncome,expense:viewExpense,debt:viewDebt,settings:viewSettings})[tab]();
  bindView();
}


function viewHome(){
  const t=totals(cur);
  const pct=t.budget?Math.round(t.expense/t.budget*100):null;
  const segs=[];
  const byCat={};
  t.exp.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+num(e.amount));
  Object.entries(byCat).forEach(([c,v])=>segs.push({n:CATS[c]?.n||c,v,c:CATS[c]?.c||'#888'}));
  if(t.loanM) segs.push({n:'Bayaran pinjaman',v:t.loanM,c:'#0b5a3f'});
  if(t.cardM) segs.push({n:'Kad & PayLater',v:t.cardM,c:'#e05a4f'});
  segs.sort((a,b)=>b.v-a.v);

function donut(segs,total){
  const R=60,C=2*Math.PI*R; let off=0;
  const arcs=segs.map(s=>{const len=s.v/total*C; const a=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${s.c}" stroke-width="26" stroke-dasharray="${Math.max(0,len-2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`; off+=len; return a;}).join('');
  const leg=segs.map(s=>`<div><i style="background:${s.c}"></i><span>${esc(s.n)}</span><b>${rm(s.v)}</b><small style="color:var(--muted);width:38px;text-align:right">${Math.round(s.v/total*100)}%</small></div>`).join('');
  return `<div class="donutwrap"><svg width="160" height="160" viewBox="0 0 160 160">${arcs}<text x="80" y="76" text-anchor="middle" font-size="11" fill="currentColor" opacity=".6">Jumlah</text><text x="80" y="94" text-anchor="middle" font-size="15" font-weight="800" fill="currentColor">${rmShort(total)}</text></svg><div class="legend">${leg}</div></div>`;
}

function cashflow(){
  const ms=[...Array(6)].map((_,i)=>addM(cur,i-5));
  const data=ms.map(k=>{const t=totals(k);return {k,i:t.income,o:t.expense+t.debtM}});
  const mx=Math.max(1,...data.flatMap(d=>[d.i,d.o]));
  return `<div class="cf">${data.map(d=>{const m=+d.k.split('-')[1];return `<div class="col ${d.k===cur?'cur':''}" title="${mLabel(d.k)}: masuk ${rm(d.i)}, keluar ${rm(d.o)}"><div class="bars"><i style="height:${d.i/mx*100}%;background:var(--brand2)"></i><i style="height:${d.o/mx*100}%;background:#e05a4f"></i></div><small>${MS[m-1]}</small></div>`}).join('')}</div>
  <div class="keyrow"><span><i style="background:var(--brand2)"></i>Masuk</span><span><i style="background:#e05a4f"></i>Keluar</span></div>`;
}

let onSave=null;
function openSheet(title,html,saveFn,delFn){
  document.getElementById('sheetTitle').textContent=title;
  document.getElementById('sheetBody').innerHTML=html+(delFn?`<button class="btn ghost block" id="sheetDel" style="color:var(--danger);margin-bottom:8px">Padam</button>`:'');
  onSave=saveFn;
  document.getElementById('sheetBg').classList.add('on');
  if(delFn) document.getElementById('sheetDel').onclick=async()=>{if(await delFn()!==false){closeSheet();save();render();toast('Dipadam')}};
}
function closeSheet(){document.getElementById('sheetBg').classList.remove('on');onSave=null}
const val=id=>document.getElementById(id)?.value??'';
const opts=(arr,sel)=>arr.map(o=>Array.isArray(o)?`<option value="${esc(o[0])}" ${o[0]===sel?'selected':''}>${esc(o[1])}</option>`:`<option ${o===sel?'selected':''}>${esc(o)}</option>`).join('');
function today(){const d=new Date();return cur===ym(d)?d.toISOString().slice(0,10):cur+'-01'}

async function delRec(e,list){
  const btns=e.recurring&&e.month<cur?[['stop','Hentikan mulai '+mLabel(cur)+' (simpan rekod lama)'],['all','Padam semua bulan','danger']]:[['all','Padam','danger']];
  const v=await ask('<p>Padam rekod ini?</p>',btns);
  if(v==='stop') e.until=addM(cur,-1); else if(v==='all') P()[list]=P()[list].filter(x=>x.id!==e.id); else return false;
}

function debtCalc(){
  const kind=val('f_kind');
  if(kind==='paylater'){
    const price=num(val('f_price')),down=num(val('f_down')),pct=num(val('f_int')),fee=num(val('f_fee')),ten=Math.max(1,Math.round(num(val('f_ten'))));
    const fin=Math.max(0,price-down), total=fin*(1+pct/100)+fee, monthly=Math.round(total/ten*100)/100;
    return {tenure:ten,monthly,total,fin,balance:0};
  }
  if(kind==='kad') return {tenure:0,monthly:num(val('f_mon')),balance:num(val('f_bal'))};
  const left=Math.max(0,Math.round(num(val('f_left')))), monthly=num(val('f_mon'));
  // store as starting this month with `left` months
  return {tenure:left,monthly,balance:0}; // loans start from the viewed month
}
function calcShow(){
  const r=debtCalc(), el=document.getElementById('f_calc'), kind=val('f_kind');
  if(kind==='paylater') el.innerHTML=`Jumlah dibiayai: <b>${rm(r.fin)}</b><br>Jumlah perlu bayar: <b>${rm(r.total)}</b><br>Bayaran bulanan: <b>${rm(r.monthly)}</b> × ${r.tenure} bulan`;
  else if(kind==='kad') el.innerHTML=r.monthly&&r.balance?`Anggaran selesai dalam <b>${Math.ceil(r.balance/r.monthly)} bulan</b> jika tiada belian baru.`:'Kad kredit dikira sebagai baki semasa. Kemas kini baki bila ada statement baru.';
  else el.innerHTML=r.monthly&&r.tenure?`Anggaran baki pinjaman: <b>${rm(r.monthly*r.tenure)}</b><br>Tamat: <b>${mLabel(addM(cur,r.tenure-1))}</b>`:'Masukkan ansuran dan baki bulan.';
}

  });
}

/* ================= EVENTS ================= */
function bindView(){
  const v=document.getElementById('view');
  v.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addFor(b.dataset.add));
  v.querySelectorAll('[data-edit-inc]').forEach(b=>b.onclick=()=>incomeForm(P().incomes.find(x=>x.id===b.dataset.editInc)));
  v.querySelectorAll('[data-edit-exp]').forEach(b=>b.onclick=()=>expenseForm(P().expenses.find(x=>x.id===b.dataset.editExp)));
  v.querySelectorAll('[data-edit-debt]').forEach(b=>b.onclick=()=>debtForm(P().debts.find(x=>x.id===b.dataset.editDebt)));
  v.querySelectorAll('[data-paid]').forEach(c=>c.onchange=()=>{const p=P().paid[cur]=P().paid[cur]||{}; if(c.checked)p[c.dataset.paid]=true; else delete p[c.dataset.paid]; save(); render()});
  const on=(id,fn)=>{const el=document.getElementById(id); if(el) el.onclick=fn};
  on('budgetBtn',budgetForm);
  on('clearDemo',async()=>{if(!await sure('Padam data contoh dan mula dengan data sendiri?','Kosongkan'))return; for(const n in S.profiles)S.profiles[n]=blankProfile(); S.demo=false; save(); render(); toast('Sedia untuk data anda')});
  on('addProf',async()=>{const n=await ask('<p>Nama profil baru</p>',[['ok','Tambah']],'cth. Keluarga, Ahmad'); if(!n)return; if(S.profiles[n])return toast('Nama sudah wujud'); S.profiles[n]=blankProfile(); S.active=n; save(); render()});
  v.querySelectorAll('[data-del-prof]').forEach(b=>b.onclick=async()=>{const n=b.dataset.delProf; if(!await sure('Padam profil "'+esc(n)+'" dan semua datanya?','Padam profil'))return; delete S.profiles[n]; if(S.active===n)S.active=Object.keys(S.profiles)[0]; save(); render()});
  on('exportBtn',()=>{
    const json=JSON.stringify(S);
    ask(`<p><b>Backup data</b></p><p style="font-size:14px;color:var(--muted)">Salin teks ini dan simpan (cth. dalam Notes atau WhatsApp ke diri sendiri).</p><textarea id="bkTxt" readonly>${esc(json)}</textarea>`,[['copy','Salin'],['file','Muat turun fail','ghost']]).then(v=>{
      if(v==='copy') navigator.clipboard.writeText(json).then(()=>toast('Disalin'),()=>{const t=document.getElementById('bkTxt');toast('Pilih semua teks & salin manual')});
      if(v==='file'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download='kewangan-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()}
    });
  });
  const restore=t=>{try{const d=JSON.parse(t); if(!d.profiles)throw 0; sure('Gantikan semua data sekarang dengan backup ini?','Pulihkan').then(ok=>{if(!ok)return;S=d;save();render();toast('Data dipulihkan')})}catch(e){toast('Backup tidak sah')}};
  on('pasteBtn',()=>ask('<p><b>Pulihkan backup</b></p><p style="font-size:14px;color:var(--muted)">Tampal teks backup di bawah.</p><textarea id="rsTxt"></textarea>',[['ok','Pulihkan']]).then(v=>{if(v)restore(document.getElementById('rsTxt').value)}));
  const imp=document.getElementById('importFile');
  if(imp) imp.onchange=()=>{const f=imp.files[0]; if(f) f.text().then(restore)};
  on('demoBtn',async()=>{if(!await sure('Tambah contoh data ke profil '+esc(S.active)+'?','Tambah','')) return; demo(); save(); tab='home'; render(); toast('Contoh data ditambah')});
  on('resetBtn',async()=>{if(!await sure('Padam SEMUA data profil '+esc(S.active)+'? Tindakan ini tidak boleh diundur.','Padam semua'))return; S.demo=false; S.profiles[S.active]=blankProfile(); save(); render(); toast('Data dipadam')});
}
function addFor(t){({income:()=>incomeForm(),expense:()=>expenseForm(),debt:()=>debtForm()})[t]?.()}

document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button'); if(!b)return; tab=b.dataset.tab; render(); window.scrollTo({top:0})};
document.getElementById('prevM').onclick=()=>{cur=addM(cur,-1);render()};
document.getElementById('nextM').onclick=()=>{cur=addM(cur,1);render()};
document.getElementById('profileSel').onchange=e=>{S.active=e.target.value;save();render()};
document.getElementById('fab').onclick=()=>addFor(tab);
document.getElementById('sheetClose').onclick=closeSheet;
document.getElementById('sheetCancel').onclick=closeSheet;
document.getElementById('sheetBg').onclick=e=>{if(e.target.id==='sheetBg')closeSheet()};
document.getElementById('sheetSave').onclick=()=>{
  if(!onSave) return;
  if(onSave()===true){ save(); closeSheet(); render(); toast('Disimpan'); }
};
function isDark(){const a=document.documentElement.dataset.theme;return a?a==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function applyTheme(){ if(S.theme==='light'||S.theme==='dark') document.documentElement.dataset.theme=S.theme; }
document.getElementById('themeBtn').onclick=()=>{S.theme=isDark()?'light':'dark';save();applyTheme()};

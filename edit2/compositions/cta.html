  <script>
    const tl = gsap.timeline({ paused: true });
    // Scene clock: 0 = comp 57.6. "keberapa" 2.05, "komen nombor" 2.91, "saya nak tengok" 4.23
    tl.fromTo("#ct-scrim", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);
    tl.fromTo("#ct-q1", { opacity: 0, y: 30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, 0.15);
    tl.fromTo("#ct-q2", { opacity: 0, y: 30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, 1.2);
    tl.fromTo(["#ct-day", "#ct-qmark"], { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.9);
    // Slot-machine roll through the day numbers
    const ids = ["#ct-n1", "#ct-n2", "#ct-n3", "#ct-n4"];
    ids.forEach((id, i) => {
      tl.fromTo(id, { y: 150 }, { y: 150, duration: 0.01 }, 0);
      const t = 2.0 + i * 0.12;
      tl.to(id, { y: 0, duration: 0.1, ease: "none" }, t);
      if (i < ids.length - 1) tl.to(id, { y: -150, duration: 0.1, ease: "none" }, t + 0.12);
    });
    tl.fromTo("#ct-n4", { scale: 1 }, { keyframes: [{ scale: 1.2, duration: 0.1 }, { scale: 1, duration: 0.2 }] }, 2.48);
    tl.fromTo("#ct-bubble", { opacity: 0, y: 60, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 2.88);
    // Typing dots
    [0, 1, 2].forEach((i) => {
      for (let k = 0; k < 6; k++) {
        tl.fromTo(`#ct-dots .ct-dot:nth-child(${i + 1})`, { y: 0 }, { keyframes: [{ y: -10, duration: 0.15 }, { y: 0, duration: 0.15 }] }, 3.3 + k * 0.5 + i * 0.12);
      }
    });
    window.__timelines["cta"] = tl;

      }

    <script>
      const tl = gsap.timeline({ paused: true });
      const shake = (t, amp = 1) =>
        tl.fromTo(
          "#cam",
          { x: 0, rotation: 0 },
          {
            keyframes: [
              { x: -16 * amp, rotation: -0.7 * amp, duration: 0.04 },
              { x: 14 * amp, rotation: 0.6 * amp, duration: 0.04 },
              { x: -9 * amp, rotation: -0.35 * amp, duration: 0.04 },
              { x: 5 * amp, rotation: 0.2 * amp, duration: 0.04 },
              { x: 0, rotation: 0, duration: 0.05 },
            ],
          },
          t,
        );
      const flash = (sel, t, peak = 0.8) =>
        tl.fromTo(sel, { opacity: 0 }, { keyframes: [{ opacity: peak, duration: 0.04 }, { opacity: 0, duration: 0.28, ease: "power2.out" }] }, t);

      // Hook: open punched in, settle onto the face
      tl.fromTo("#cam", { scale: 1.25 }, { scale: 1, duration: 0.6, ease: "expo.out" }, 0);
      // RM50 — SHOCK: snap zoom, shake, red flash and red edges
      tl.to("#cam", { scale: 1.32, duration: 0.1, ease: "power4.out" }, 4.6);
      shake(4.6, 1.2);
      flash("#fx-flash-red", 4.6, 0.55);
      tl.fromTo("#fx-shock", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 4.6);
      tl.to("#fx-shock", { opacity: 0, duration: 0.4 }, 5.5);
      tl.to("#cam", { scale: 1.4, duration: 1.2, ease: "power1.out" }, 4.74);
      // "Mesti pernah." — SAD: drained blue, slow push
      tl.set("#cam", { scale: 1.12 }, 5.94);
      tl.fromTo(["#fx-sad", "#fx-sad-dim"], { opacity: 0 }, { opacity: 0.85, duration: 0.25, ease: "power2.out" }, 5.94);
      tl.to("#cam", { scale: 1.22, duration: 0.82, ease: "power1.inOut" }, 5.94);
      tl.to(["#fx-sad", "#fx-sad-dim"], { opacity: 0, duration: 0.2 }, 6.7);
      // Problem
      tl.set("#cam", { scale: 1 }, 6.76);
      tl.to("#cam", { scale: 1.08, duration: 6, ease: "none" }, 8.0);
      // "Tak akan ada" — punch + white flash on RM0
      tl.to("#cam", { scale: 1.28, duration: 0.1, ease: "power4.out" }, 14.82);
      shake(14.82, 1);
      flash("#fx-flash", 14.82, 0.7);
      // 3 perkara
      tl.set("#cam", { scale: 1 }, 15.61);
      tl.to("#cam", { scale: 1.14, duration: 0.12, ease: "power4.out" }, 17.85);

<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      body { font-family: "Montserrat", sans-serif; }
      :root {
        --gold-1: #fff1b8; --gold-2: #e9c766; --gold-3: #c99a2e; --gold-4: #f5dc8f; --gold-5: #9d7220;
        --gold-text: linear-gradient(100deg, #fff3c4 0%, #ecc867 28%, #c8962b 55%, #f6dd92 78%, #a9781f 100%);
      }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }

      /* ---------- footage ---------- */
      #cam { position: absolute; inset: 0; overflow: hidden; transform-origin: 50% 56%; }
      #a-roll { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

      /* ---------- decoration layers ---------- */
      #topshade { position: absolute; left: 0; right: 0; top: 0; height: 760px; pointer-events: none;
        background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.28) 45%, rgba(0,0,0,0) 100%); }
      #botshade { position: absolute; left: 0; right: 0; bottom: 0; height: 820px; pointer-events: none;
        background: linear-gradient(0deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.42) 38%, rgba(0,0,0,0) 100%); }
      #dim { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
      #leak { position: absolute; left: -200px; top: -300px; width: 1500px; height: 1500px; opacity: 0; pointer-events: none;
        mix-blend-mode: screen;
        background: radial-gradient(closest-side, rgba(255,196,110,.85), rgba(255,140,60,.35) 45%, rgba(255,120,40,0) 75%); }
      #flash { position: absolute; inset: 0; background: #fff6dc; opacity: 0; pointer-events: none; mix-blend-mode: screen; }

      .gold { background: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; }

      /* ---------- hook ---------- */
      #hook { position: absolute; inset: 0; }
      #hook .stack { position: absolute; left: 0; right: 0; top: 250px; text-align: center; }
      #hook .l1, #hook .l3 { display: block; font-family: "Montserrat"; font-weight: 600; font-size: 54px; color: #fff;
        letter-spacing: .02em; text-shadow: 0 4px 24px rgba(0,0,0,.7); }
      #hook .l2wrap { display: block; margin: -6px 0 18px; }
      #hook .l2 { display: inline-block; font-family: "Playfair Display"; font-style: italic; font-weight: 800; font-size: 200px; line-height: 1.05;
        padding: 0 30px; filter: drop-shadow(0 8px 30px rgba(0,0,0,.6)); }
      #hook .rule { display: block; width: 0; height: 2px; margin: 18px auto 0; background: linear-gradient(90deg, transparent, var(--gold-2), transparent); }

      /* ---------- badge ---------- */
      #badge { position: absolute; left: 0; right: 0; top: 196px; height: 60px; text-align: center; }
      #badge .inner { display: inline-flex; align-items: center; gap: 22px; }
      #badge .ln { display: inline-block; width: 90px; height: 1.5px; background: linear-gradient(90deg, transparent, var(--gold-2)); transform-origin: right center; }
      #badge .ln.r { background: linear-gradient(270deg, transparent, var(--gold-2)); transform-origin: left center; }
      #badge .txt { font-family: "Montserrat"; font-weight: 600; font-size: 28px; letter-spacing: .42em; padding-left: .42em; }

      /* ---------- captions ---------- */
      .cap { position: absolute; left: 0; right: 0; top: 290px; height: 260px; text-align: center; overflow: visible; }
      .cap .line { position: absolute; left: 60px; right: 60px; top: 0; text-align: center; line-height: 1.12; }
      .cap .row { display: block; white-space: nowrap; }
      .cap .w { display: inline-block; font-family: "Montserrat"; font-weight: 700; font-size: 70px; color: #fff;
        text-shadow: 0 4px 22px rgba(0,0,0,.75); margin: 0 12px; }
      .cap .w.k { font-family: "Playfair Display"; font-style: italic; font-weight: 800; font-size: 96px; text-shadow: none;
        filter: drop-shadow(0 6px 22px rgba(0,0,0,.65)); }
      .cap .w.k .in { background: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 8px; }

      /* ---------- signature (corner) ---------- */
      #sign { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #sign .box { position: absolute; left: 50px; top: 1410px; width: 560px; }
      #sign svg { display: block; width: 430px; height: auto; overflow: visible; filter: drop-shadow(0 3px 10px rgba(0,0,0,.55)); }
      .namebar { display: flex; align-items: center; gap: 14px; margin: 4px 0 0 18px; }
      .namebar .dash { display: inline-block; width: 46px; height: 1.5px; background: linear-gradient(90deg, transparent, var(--gold-2)); transform-origin: left center; }
      .namebar .nm { font-family: "EB Garamond"; font-weight: 600; font-size: 32px; letter-spacing: .3em; white-space: nowrap; }
      .namebar .nm span { display: inline-block; }

      /* ---------- quote (cinematic) ---------- */
      #bars { position: absolute; inset: 0; pointer-events: none; }
      #bars .bt, #bars .bb { position: absolute; left: 0; right: 0; height: 168px; background: #000; }
      #bars .bt { top: 0; } #bars .bb { bottom: 0; }
      #quote { position: absolute; inset: 0; }
      #quote .q { position: absolute; left: 0; right: 0; text-align: center; }
      #q0 { top: 232px; font-family: "Montserrat"; font-weight: 600; font-size: 30px; letter-spacing: .5em; padding-left: .5em; }
      #q1 { top: 286px; font-family: "Playfair Display"; font-style: italic; font-weight: 700; font-size: 92px; }
      #q2 { top: 410px; font-family: "Playfair Display"; font-weight: 600; font-size: 74px; color: #fff; text-shadow: 0 5px 26px rgba(0,0,0,.8); }
      #q3 { top: 506px; font-family: "Playfair Display"; font-style: italic; font-weight: 600; font-size: 74px; color: #fff; text-shadow: 0 5px 26px rgba(0,0,0,.8); }
      #q1 .gold { padding: 0 14px; filter: drop-shadow(0 6px 24px rgba(0,0,0,.7)); }

      /* ---------- end card ---------- */
      #endcard { position: absolute; inset: 0; }
      #endcard .bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, #1b1610 0%, #070605 60%, #000 100%); opacity: 0; }
      #endcard .center { position: absolute; left: 0; right: 0; top: 560px; text-align: center; }
      #endcard svg { width: 760px; height: auto; overflow: visible; display: block; margin: 0 auto; }
      #endcard .namebar { justify-content: center; margin: 22px 0 0 0; }
      #endcard .namebar .nm { font-size: 46px; }
      #endcard .namebar .dash { width: 80px; }
      #endcard .namebar .dash.r { background: linear-gradient(270deg, transparent, var(--gold-2)); transform-origin: right center; }
      @font-face { font-family: "EmojiColor"; src: local("Noto Color Emoji"); }
      #endcard .tag { margin-top: 38px; font-family: "Montserrat", "EmojiColor", sans-serif; font-weight: 600; font-size: 30px; letter-spacing: .24em; padding-left: .24em; color: rgba(255,255,255,.82); white-space: nowrap; }
      #endcard .tag2 { margin-top: 18px; font-family: "Playfair Display", "EmojiColor", serif; font-style: italic; font-weight: 600; font-size: 46px; color: #fff; white-space: nowrap; }
      #endcard .tag2 .gold { padding: 0 6px; }
      #endcard .orn { width: 0; height: 1.5px; margin: 46px auto 0; background: linear-gradient(90deg, transparent, var(--gold-2), transparent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24.5" data-width="1080" data-height="1920">

      <!-- A-roll (cut + colour graded + audio cleaned in ffmpeg) -->
      <div id="cam">
        <video id="a-roll" class="clip" src="assets/graded.mp4" playsinline data-has-audio="true" data-volume="1"
          data-start="0" data-duration="20.28" data-track-index="0"></video>
      </div>

      <div id="topshade"></div>
      <div id="botshade"></div>
      <div id="dim"></div>
      <div id="leak"></div>

      <!-- HOOK : frame 0 = thumbnail -->
      <div id="hook" class="clip" data-start="0" data-duration="1.8" data-track-index="1" data-track-kind="graphics">
        <div class="stack">
          <span class="l1" id="h1">Siapa yang paling</span>
          <span class="l2wrap"><span class="l2 gold" id="h2">jujur</span></span>
          <span class="l3" id="h3">tentang dirimu?</span>
          <span class="rule" id="hrule"></span>
        </div>
      </div>

      <!-- BADGE -->
      <div id="badge" class="clip" data-start="1.5" data-duration="14.2" data-track-index="2" data-track-kind="graphics">
        <div class="inner" id="badgeInner">
          <span class="ln" id="bl"></span>
          <span class="txt gold" id="btxt">KATA-KATA HARI INI</span>
          <span class="ln r" id="br"></span>
        </div>
      </div>

      <!-- CAPTIONS -->
      <div id="captions">
      %%CAPS%%
      </div>

      <!-- CINEMATIC QUOTE -->
      <div id="bars" class="clip" data-start="15.6" data-duration="4.3" data-track-index="4" data-track-kind="graphics">
        <div class="bt" id="barT"></div><div class="bb" id="barB"></div>
      </div>
      <div id="quote" class="clip" data-start="15.68" data-duration="4.2" data-track-index="5" data-track-kind="graphics"><div id="quoteInner">
        <div class="q" id="q0"><span class="gold">YANG PENTING</span></div>
        <div class="q" id="q1"><span class="gold">di mata Allah SWT,</span></div>
        <div class="q" id="q2">kita hamba-Nya</div>
        <div class="q" id="q3">yang macam mana?</div>
      </div></div>

      <!-- SIGNATURE (corner) -->
      <div id="sign" class="clip" data-start="1.7" data-duration="18.2" data-track-index="6" data-track-kind="graphics">
        <div class="box" id="signBox">
          <svg viewBox="%%SIG_VB%%" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="gA" x1="0" y1="0" x2="1" y2="0.35">
                <stop offset="0" stop-color="#fff3c4"/><stop offset=".3" stop-color="#ecc867"/><stop offset=".55" stop-color="#c8962b"/>
                <stop offset=".78" stop-color="#f6dd92"/><stop offset="1" stop-color="#a9781f"/>
              </linearGradient>
              <linearGradient id="glA" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="wfA" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#fff"/><stop offset=".85" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
              <mask id="mA" maskUnits="userSpaceOnUse" x="-60" y="-260" width="820" height="400"><rect id="wipeA" x="-20" y="-230" width="0" height="320" fill="url(#wfA)"/></mask>
              <clipPath id="cA"><path d="%%SIG_D%%"/></clipPath>
            </defs>
            <path id="sigStrokeA" class="sigstroke" d="%%SIG_D%%" fill="none" stroke="#f1d27a" stroke-width="1.4" stroke-linejoin="round"/>
            <path id="sigFillA" d="%%SIG_D%%" fill="url(#gA)" mask="url(#mA)"/>
            <path id="swashA" class="sigstroke" d="M250 26 C 380 36, 540 30, 676 -22" fill="none" stroke="url(#gA)" stroke-width="3.2" stroke-linecap="round"/>
            <g clip-path="url(#cA)"><rect id="glintA" x="-160" y="-230" width="120" height="320" fill="url(#glA)" transform="skewX(-18)"/></g>
          </svg>
          <div class="namebar">
            <span class="dash" id="ndA"></span>
            <span class="nm gold" id="nmA">LUKMAN HAKIM</span>
          </div>
        </div>
      </div>

      <!-- END CARD -->
      <div id="endcard" class="clip" data-start="19.75" data-duration="4.75" data-track-index="7" data-track-kind="graphics">
        <div class="bg" id="endBg"></div>
        <div class="center">
          <svg viewBox="%%SIG_VB%%" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="gB" x1="0" y1="0" x2="1" y2="0.35">
                <stop offset="0" stop-color="#fff3c4"/><stop offset=".3" stop-color="#ecc867"/><stop offset=".55" stop-color="#c8962b"/>
                <stop offset=".78" stop-color="#f6dd92"/><stop offset="1" stop-color="#a9781f"/>
              </linearGradient>
              <linearGradient id="glB" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="wfB" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#fff"/><stop offset=".85" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
              <mask id="mB" maskUnits="userSpaceOnUse" x="-60" y="-260" width="820" height="400"><rect id="wipeB" x="-20" y="-230" width="0" height="320" fill="url(#wfB)"/></mask>
              <clipPath id="cB"><path d="%%SIG_D%%"/></clipPath>
            </defs>
            <path id="sigStrokeB" class="sigstroke" d="%%SIG_D%%" fill="none" stroke="#f1d27a" stroke-width="1.1" stroke-linejoin="round"/>
            <path id="sigFillB" d="%%SIG_D%%" fill="url(#gB)" mask="url(#mB)"/>
            <path id="swashB" class="sigstroke" d="M250 26 C 380 36, 540 30, 676 -22" fill="none" stroke="url(#gB)" stroke-width="2.6" stroke-linecap="round"/>
            <g clip-path="url(#cB)"><rect id="glintB" x="-160" y="-230" width="120" height="320" fill="url(#glB)" transform="skewX(-18)"/></g>
          </svg>
          <div class="namebar">
            <span class="dash" id="ndB1"></span>
            <span class="nm gold" id="nmB">LUKMAN HAKIM</span>
            <span class="dash r" id="ndB2"></span>
          </div>
          <div class="orn" id="endOrn"></div>
          <div class="tag" id="endTag">💼 FINANCIAL CONTENT CREATOR 📈</div>
          <div class="tag2" id="endTag2">Insan biasa, <span class="gold">bercita-cita luar biasa</span> ✨</div>
        </div>
      </div>

      <div id="flash"></div>

      <!-- MUSIC + SFX -->
%%AUDIO%%
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";

      /* ---------- camera: punch-ins hide every jump cut ---------- */
      const cam = "#cam";
      tl.fromTo(cam, { scale: 1.14 }, { scale: 1.08, duration: 1.55, ease: "power2.out" }, 0);
      const cuts = [
        [1.55, 1.00, 1.015], [2.10, 1.065, 1.08], [3.85, 1.00, 1.02], [5.70, 1.05, 1.075],
        [9.55, 1.00, 1.02], [12.10, 1.04, 1.06], [15.63, 1.10, 1.12], [16.28, 1.06, 1.13],
        [18.25, 1.15, 1.19], [19.68, 1.08, 1.09]
      ];
      cuts.forEach(([t, a, b], i) => {
        const end = i + 1 < cuts.length ? cuts[i + 1][0] : 20.28;
        tl.set(cam, { scale: a }, t);
        tl.to(cam, { scale: b, duration: (t === 9.55 ? 11.36 : end) - t, ease: "none" }, t);
      });
      // emphasis punch on "manusia"
      tl.to(cam, { scale: 1.12, duration: 0.22, ease: "power3.out" }, 11.36);
      tl.to(cam, { scale: 1.10, duration: 0.5, ease: "power2.inOut" }, 11.6);

      /* ---------- light leaks + flashes on transitions ---------- */
      function leak(t, x0, x1, peak) {
        tl.set("#leak", { x: x0 }, t);
        tl.to("#leak", { opacity: peak, x: (x0 + x1) / 2, duration: 0.3, ease: "power2.out" }, t);
        tl.to("#leak", { opacity: 0, x: x1, duration: 0.7, ease: "power2.in" }, t + 0.3);
      }
      leak(1.40, -500, 400, 0.45);
      leak(9.45, 500, -400, 0.35);
      leak(15.62, -400, 500, 0.5);
      leak(19.7, 300, -300, 0.4);
      tl.to("#flash", { opacity: 0.35, duration: 0.06 }, 15.68);
      tl.to("#flash", { opacity: 0, duration: 0.4 }, 15.74);

      /* ---------- hook ---------- */
      tl.fromTo("#h2", { scale: 1.18, opacity: 1 }, { scale: 1, duration: 0.9, ease: "expo.out" }, 0);
      tl.fromTo("#h1", { y: 0, opacity: 1 }, { y: -6, duration: 1.4, ease: "none" }, 0);
      tl.fromTo("#h3", { y: 0, opacity: 1 }, { y: 6, duration: 1.4, ease: "none" }, 0);
      tl.fromTo("#hrule", { width: 0 }, { width: 420, duration: 0.8, ease: E }, 0.15);
      tl.to(["#h1", "#h3", "#hrule"], { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, 1.42);
      tl.to("#h2", { opacity: 0, scale: 0.7, y: -120, duration: 0.3, ease: "power2.in" }, 1.42);

      /* ---------- badge ---------- */
      tl.fromTo("#btxt", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.7, ease: E }, 1.55);
      tl.fromTo(["#bl", "#br"], { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: E }, 1.7);
      tl.to("#badgeInner", { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" }, 15.42);

      /* ---------- captions ---------- */
      function word(sel, t, key) {
        const from = key ? { opacity: 0, scale: 1.45, y: 8 } : { opacity: 0, scale: 1, y: 26 };
        const to = key ? { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "back.out(2.2)" } : { opacity: 1, scale: 1, y: 0, duration: 0.26, ease: E };
        tl.fromTo(sel, from, to, t);
      }
      function capOut(sel, dur, start) {
        tl.to(sel + " .line", { opacity: 0, y: -14, duration: 0.14, ease: "power2.in" }, start + dur - 0.16);
      }
      %%CAPS_JS%%

      /* ---------- corner signature ---------- */
      function sigDraw(sfx, t, dur) {
        const p = document.querySelector("#sigStroke" + sfx);
        const L = Math.ceil(p.getTotalLength());
        const s = document.querySelector("#swash" + sfx);
        const Ls = Math.ceil(s.getTotalLength());
        tl.fromTo(p, { strokeDasharray: L, strokeDashoffset: L, opacity: 1 }, { strokeDashoffset: 0, duration: dur, ease: "power1.inOut" }, t);
        tl.fromTo("#wipe" + sfx, { attr: { width: 0 } }, { attr: { width: 760 }, duration: dur * 0.95, ease: "power1.inOut" }, t + dur * 0.18);
        tl.to(p, { opacity: 0, duration: 0.5 }, t + dur + 0.1);
        tl.fromTo(s, { strokeDasharray: Ls, strokeDashoffset: Ls }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, t + dur * 0.92);
        tl.fromTo("#glint" + sfx, { attr: { x: -160 } }, { attr: { x: 900 }, duration: 0.9, ease: "power2.inOut" }, t + dur + 0.25);
      }
      sigDraw("A", 1.95, 1.5);
      tl.fromTo("#ndA", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: E }, 3.05);
      tl.fromTo("#nmA", { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.8, ease: E }, 3.1);
      // second glint mid-video keeps it alive
      tl.fromTo("#glintA", { attr: { x: -160 } }, { attr: { x: 900 }, duration: 1.0, ease: "power2.inOut" }, 10.2);
      tl.to("#signBox", { opacity: 0, y: 10, duration: 0.3, ease: "power2.in" }, 19.55);

      /* ---------- cinematic quote ---------- */
      tl.fromTo("#barT", { yPercent: -100 }, { yPercent: 0, duration: 0.5, ease: "power3.inOut" }, 15.6);
      tl.fromTo("#barB", { yPercent: 100 }, { yPercent: 0, duration: 0.5, ease: "power3.inOut" }, 15.6);
      tl.to("#dim", { opacity: 0.3, duration: 0.6, ease: "power2.out" }, 15.6);
      tl.fromTo("#q0", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.6, ease: E }, 15.72);
      tl.fromTo("#q1", { opacity: 0, y: 40, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "expo.out" }, 16.40);
      tl.fromTo("#q2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: E }, 17.76);
      tl.fromTo("#q3", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: E }, 18.80);
      tl.to("#quoteInner", { opacity: 0, duration: 0.2, ease: "power2.in" }, 19.62);

      /* ---------- end card ---------- */
      tl.fromTo("#endBg", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.inOut" }, 19.75);
      sigDraw("B", 20.05, 1.25);
      tl.fromTo(["#ndB1", "#ndB2"], { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: E }, 20.9);
      tl.fromTo("#nmB", { opacity: 0, scale: 1.1 }, { opacity: 1, scale: 1, duration: 0.8, ease: E }, 20.85);
      tl.fromTo("#endOrn", { width: 0 }, { width: 300, duration: 0.6, ease: E }, 20.85);
      tl.fromTo("#endTag", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 20.95);
      tl.fromTo("#endTag2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 21.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

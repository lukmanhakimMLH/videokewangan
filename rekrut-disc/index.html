/* ===================== STORAGE =====================
   Dalam claude.ai: simpan dalam db artifact di data/users/<id>/ (peribadi untuk pemilik, sync antara peranti).
   Di luar claude.ai: fallback IndexedDB dalam browser. */
const IDB = (()=>{
  let dbp;
  const open = () => dbp ||= new Promise((res,rej)=>{
    const r = indexedDB.open('rekrut-disc',1);
    r.onupgradeneeded = () => r.result.createObjectStore('agents',{keyPath:'id'});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res,rej)=>{
    const t = db.transaction('agents',mode); const out = fn(t.objectStore('agents'));
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error);
  });};
  return { all: () => tx('readonly', s => s.getAll()), put: a => tx('readwrite', s => s.put(a)), del: id => tx('readwrite', s => s.delete(id)) };
})();

const DB = (()=>{
  let cache = new Map(), col = null, mode = 'local';
  const clone = o => JSON.parse(JSON.stringify(o));
  const setSync = t => { const el=document.getElementById('sync'); if(el) el.textContent=t; };
  async function init(onChange){
    let db=null, user=null, uid=null;
    if(window.claude?.use){
      try{ [db,user] = await Promise.all([claude.use('db'), claude.use('user')]); uid = user ? await user.id() : null; }catch{}
    }
    const role = !user ? 'local' : (await user.isOwner().catch(()=>false)) ? 'owner' : 'agent';
    const ctx = {db, user, uid, role};
    if(role==='agent'){ setSync(db&&uid ? (window.__HOSTED?'☁ Disimpan dalam talian':'☁ Disimpan dalam akaun Claude anda') : '⚠ Tiada akses data'); return ctx; }
    if(db && uid){
      mode='cloud'; col = db.collection(window.__REKRUT_COL || 'data/users/'+uid);
      setSync('Memuatkan data…');
      await new Promise(res=>{
        let first=true;
        const t=setTimeout(()=>{ setSync('⚠ Tak dapat sambung — data mungkin tak terkini'); res(); },10000);
        col.onSnapshot(snap=>{
          cache = new Map(snap.docs.map(d=>[d.id, d.data()]));
          if(!snap.metadata.fromCache){ clearTimeout(t); setSync((window.__HOSTED?'☁ Disimpan dalam talian':'☁ Disimpan dalam akaun Claude anda')); }
          if(first){ first=false; res(); } else onChange();
        }, e=>{ clearTimeout(t); setSync('⚠ Ralat sambungan data ('+e.code+')'); res(); });
      });
    } else {
      try{ (await IDB.all()).forEach(a=>cache.set(a.id,a)); setSync('📱 Disimpan dalam peranti ini sahaja'); }
      catch{ setSync('⚠ Storan tidak tersedia — data tak akan disimpan'); }
    }
    return ctx;
  }
  return {
    init,
    get mode(){ return mode; },
    all: async () => [...cache.values()].map(clone),
    get: async id => cache.has(id) ? clone(cache.get(id)) : undefined,
    put: async a => {
      cache.set(a.id, clone(a));
      try{ if(col) await col.doc(a.id).set(clone(a)); else await IDB.put(a); }
      catch(e){ toast(e?.code==='quota_exceeded' ? 'Storan penuh — padam calon lama' : 'Gagal simpan, cuba lagi'); throw e; }
    },
    del: async id => { cache.delete(id); if(col) await col.doc(id).delete(); else await IDB.del(id); },
  };
})();

    document.body.appendChild(bg);

}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
function fmtIC(v){ const d=v.replace(/\D/g,'').slice(0,12); return d.length>8?`${d.slice(0,6)}-${d.slice(6,8)}-${d.slice(8)}`:d.length>6?`${d.slice(0,6)}-${d.slice(6)}`:d; }
function icInfo(ic){
  const d=(ic||'').replace(/\D/g,''); if(d.length!==12) return '';
  let yy=+d.slice(0,2), mm=+d.slice(2,4), dd=+d.slice(4,6);
  const now=new Date(); const yr = yy + (yy > now.getFullYear()%100 ? 1900 : 2000);
  if(mm<1||mm>12||dd<1||dd>31) return '';
  let age = now.getFullYear()-yr; if(now.getMonth()+1<mm || (now.getMonth()+1===mm && now.getDate()<dd)) age--;
  const g = (+d[11])%2 ? 'Lelaki' : 'Perempuan';
  return `${age} tahun · ${g}`;
}
function resizeImage(file, max=320){
  return new Promise((res,rej)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.75)); };
    img.onerror=rej; img.src=url;
  });
}
function scoreDisc(ans){
  const sc={D:0,I:0,S:0,C:0}, most={D:0,I:0,S:0,C:0};
  ans.forEach(a=>{ if(a.m){sc[a.m]++;most[a.m]++;} if(a.l) sc[a.l]--; });
  const ranked = Object.keys(sc).sort((x,y)=> sc[y]-sc[x] || most[y]-most[x]);
  const pct = Object.fromEntries(Object.entries(sc).map(([k,v])=>[k, Math.round((v+20)/40*100)]));
  const primary = ranked[0];
  const secondary = sc[ranked[1]] > 0 && sc[ranked[0]]-sc[ranked[1]] <= 4 ? ranked[1] : null;
  return {score:sc, pct, primary, secondary, style: primary+(secondary||''), date:Date.now()};
}

  const qs = QUESTIONS.map((Q,i)=>`*${i+1}. ${Q.q}*\n` + orderFor(i).map((k,j)=>`${LETTERS[j]}. ${Q.o[k]}`).join('\n')).join('\n\n');
  return `Assalamualaikum & salam sejahtera 👋
Terima kasih atas minat untuk menyertai kerjaya takaful bersama kami.

Sila jawab *2 bahagian* di bawah dan balas dalam WhatsApp ini. Tiada jawapan betul atau salah — jawab ikut diri sebenar 🙂

━━━━━━━━━━━━━━
*BAHAGIAN 1: MAKLUMAT DIRI*
━━━━━━━━━━━━━━
Nama penuh (ikut IC) : 
No. tel : 
No. IC : 
Alamat : 
Pendidikan (SPM / Diploma / Ijazah) : 

📸 Sertakan juga *1 gambar selfie*.

━━━━━━━━━━━━━━
*BAHAGIAN 2: GAYA PERSONALITI (20 soalan)*
━━━━━━━━━━━━━━
Setiap soalan, pilih *2 huruf*:
✅ Huruf pertama = PALING macam saya
❌ Huruf kedua = PALING TIDAK macam saya

${qs}

━━━━━━━━━━━━━━
👉 *Untuk balas:* salin templat jawapan yang saya hantar selepas ini, isi, dan hantar semula. Contoh: *1. B D*
Terima kasih! 🙏`;
}
function templatText(){
  return `Nama penuh (ikut IC) : 
No. tel : 
No. IC : 
Alamat : 
Pendidikan (SPM / Diploma / Ijazah) : 

JAWAPAN (✅ Paling saya, ❌ Paling tidak saya)
${QUESTIONS.map((_,i)=>`${i+1}. `).join('\n')}`;
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast('Disalin ✓'); return; }catch{}
  const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
  ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch{} ta.remove();
  toast(ok?'Disalin ✓':'Tak dapat salin — guna butang WhatsApp');
}

async function viewHantar(id){
  const a = id ? await DB.get(id) : null;
  $('#app').innerHTML = `
    <h2>📤 Hantar Borang via WhatsApp</h2>
    <div class="card">
      <label>No. WhatsApp calon (boleh kosong — pilih kenalan dalam WhatsApp)</label>
      <input id="waTel" type="tel" inputmode="tel" value="${esc(a?.tel)}" placeholder="012-3456789">
      <h3>Langkah 1 — Hantar soalan</h3>
      <div class="row"><a class="btn btn-primary grow" id="wa1" target="_blank">💬 Hantar Borang</a><button id="cp1">📋 Salin</button></div>
      <h3>Langkah 2 — Hantar templat jawapan</h3>
      <p class="small muted" style="margin:0 0 6px">Mesej pendek berasingan supaya calon senang tekan lama → Salin → isi → hantar balik.</p>
      <div class="row"><a class="btn btn-primary grow" id="wa2" target="_blank">💬 Hantar Templat</a><button id="cp2">📋 Salin</button></div>
      <h3>Langkah 3</h3>
      <p class="small" style="margin:0">Bila calon balas, tekan lama mesej dia → <b>Copy</b> → buka <a href="#/tampal">📥 Tampal Jawapan</a>.</p>
    </div>
    <details class="card"><summary><b>Lihat mesej borang</b></summary><pre class="preview">${esc(borangText())}</pre></details>`;
  const upd = () => { const n=waNum($('#waTel').value); const base='https://wa.me/'+(n||'')+'?text=';
    $('#wa1').href = base+encodeURIComponent(borangText()); $('#wa2').href = base+encodeURIComponent(templatText()); };
  $('#waTel').oninput=upd; upd();
  $('#cp1').onclick=()=>copyText(borangText()); $('#cp2').onclick=()=>copyText(templatText());
}

function parseReply(txt){
  const out = {fields:{}, ans: QUESTIONS.map(()=>({m:null,l:null})), problems:[]};
  const F = [
    [/^(?:nama(?:\s*penuh)?)$/i,'nama'], [/^(?:no\.?\s*)?(?:tel(?:efon)?|hp|phone|whatsapp)$/i,'tel'],
    [/^(?:no\.?\s*)?(?:ic|k\/?p|kad\s*pengenalan|mykad)$/i,'ic'], [/^alamat$/i,'alamat'], [/^pendidikan$/i,'pendidikan'],
  ];
  const lines = txt.replace(/\r/g,'').split('\n').map(l=>l.replace(/[*_~]/g,'').trim());
  let lastField=null;
  for(const line of lines){
    const am = line.match(/^(\d{1,2})\s*[.)\-:]?\s*([A-D])\s*[,\/&\-–\s]*\s*([A-D])\s*$/i);
    if(am){ const n=+am[1]-1; if(n>=0 && n<QUESTIONS.length){ const ord=orderFor(n), m=am[2].toUpperCase(), l=am[3].toUpperCase();
      if(m===l) out.problems.push(`Soalan ${n+1}: huruf ✅ dan ❌ sama (${m})`); else out.ans[n]={m:ord[LETTERS.indexOf(m)], l:ord[LETTERS.indexOf(l)]}; }
      lastField=null; continue; }
    const fm = line.match(/^([^:：]{1,50})\s*[:：]\s*(.*)$/);
    if(fm){ const hit = F.find(([re])=>re.test(fm[1].replace(/\([^)]*\)/g,'').trim())); if(hit){ out.fields[hit[1]] = fm[2].trim(); lastField = hit[1]==='alamat'?'alamat':null; continue; } }
    if(lastField==='alamat' && line && !/^jawapan/i.test(line) && !/^\d/.test(line)) out.fields.alamat += (out.fields.alamat?', ':'')+line;
    else lastField=null;
  }
  const f=out.fields;
  if(f.ic) f.ic = fmtIC(f.ic);
  if(f.pendidikan!==undefined){ const p=f.pendidikan.toLowerCase();
    f.pendidikan = /ijazah|degree|sarjana|master|phd|bachelor/.test(p)?'Ijazah (Degree)':/dip/.test(p)?'Diploma':/spm|spmv/.test(p)?'SPM':(p?'Lain-lain':''); }
  out.answered = out.ans.filter(x=>x.m&&x.l).length;
  return out;
}
const sameTel = (a,b) => a && b && waNum(a)===waNum(b);
const sameIC = (a,b) => a && b && a.replace(/\D/g,'')===b.replace(/\D/g,'');

async function viewTampal(){
  $('#app').innerHTML = `
    <h2>📥 Tampal Jawapan WhatsApp</h2>
    <div class="card">
      <p class="small muted" style="margin-top:0">Dalam WhatsApp: tekan lama mesej balasan calon → <b>Copy</b> → tampal di bawah. Kalau calon balas dalam beberapa mesej, tampal semuanya sekali.</p>
      <textarea id="paste" style="min-height:180px" placeholder="Nama: Ahmad&#10;No Tel: 0123456789&#10;...&#10;1. B D&#10;2. A C"></textarea>
    </div>
    <div id="res"></div>`;
  const ta=$('#paste');
  const run = async () => {
    const r = parseReply(ta.value), f = r.fields;
    if(!ta.value.trim()){ $('#res').innerHTML=''; return; }
    const all = await DB.all();
    const match = all.find(a=>sameIC(a.ic,f.ic)) || all.find(a=>sameTel(a.tel,f.tel));
    const missingQ = r.ans.map((x,i)=>x.m&&x.l?null:i+1).filter(Boolean);
    const disc = r.answered===QUESTIONS.length ? scoreDisc(r.ans) : null;
    const name = f.nama || match?.nama;
    $('#res').innerHTML = `
      <div class="card">
        <h3 style="margin-top:0">Semak</h3>
        <dl class="kv">
          <dt>Nama</dt><dd>${f.nama?esc(f.nama):'<span class="err">tiada</span>'}</dd>
          <dt>Telefon</dt><dd>${f.tel?esc(f.tel):'<span class="err">tiada</span>'}</dd>
          <dt>No. IC</dt><dd>${esc(f.ic)||'-'} <span class="small muted">${icInfo(f.ic)}</span></dd>
          <dt>Alamat</dt><dd>${esc(f.alamat)||'-'}</dd>
          <dt>Pendidikan</dt><dd>${esc(f.pendidikan)||'-'}</dd>
          <dt>Jawapan DISC</dt><dd class="${disc?'ok':'err'}"><b>${r.answered}/${QUESTIONS.length}</b>${missingQ.length&&missingQ.length<QUESTIONS.length?` — belum: ${missingQ.join(', ')}`:''}</dd>
          ${disc?`<dt>Keputusan</dt><dd><span class="badge ${disc.primary}">${disc.style} · ${NAMES[disc.primary]}</span></dd>`:''}
        </dl>
        ${r.problems.length?`<p class="small err">${r.problems.map(esc).join('<br>')}</p>`:''}
        ${match?`<p class="small">🔁 Padan dengan calon sedia ada: <b>${esc(match.nama)}</b> — maklumat akan dikemaskini.</p>`:''}
        ${!disc && r.answered>0?`<p class="small muted">Boleh simpan maklumat dulu; DISC dikira bila semua 20 dijawab.</p>`:''}
        <button class="btn-primary" id="imp" style="width:100%" ${name&&(f.tel||match)?'':'disabled'}>${match?'Kemaskini':'Simpan'} Calon</button>
        ${name&&(f.tel||match)?'':'<p class="small err">Perlu sekurang-kurangnya Nama & No. Tel.</p>'}
      </div>`;
    const btn=$('#imp'); if(btn) btn.onclick = async () => {
      const now=Date.now(), base = match || {id:uid(), status:'prospek', createdAt:now, history:[{status:'prospek',date:now}], pendidikan:'SPM', foto:''};
      const rec = {...base, updatedAt:now};
      for(const k of ['nama','tel','ic','alamat','pendidikan']) if(f[k]) rec[k]=f[k];
      if(disc) rec.disc = {...disc, answers:r.ans, sumber:'whatsapp'};
      if(!rec.sumber) rec.sumber='WhatsApp';
      await DB.put(rec); toast(disc?`Disimpan · ${disc.style}`:'Disimpan');
      go('#/calon/'+rec.id);
    };
  };
  ta.oninput = () => { clearTimeout(ta._t); ta._t=setTimeout(run,300); };
}

/* ===================== ROUTER ===================== */
async function route(){
  const h = location.hash || '#/';
  const [, view, id] = h.split('/');
  const sect = (view==='apa') ? 'apa' : (view==='pasukan') ? 'pasukan' : 'rekrut';
  $('#fab').classList.toggle('hidden', !!view || ROLE==='agent');
  $('#title').textContent = sect==='rekrut' ? 'Rekrut Takaful · DISC' : sect==='apa' ? 'APA '+new Date().getFullYear() : 'MAPA '+new Date().getFullYear();
  $('#nav').innerHTML = ROLE==='agent' ? '' : [['rekrut','Rekrut','#/'],['apa','APA','#/apa'],['pasukan','MAPA','#/pasukan']]
    .map(([k,l,hh])=>`<button class="btn-sm ${sect===k?'on':''}" onclick="go('${hh}')">${l}</button>`).join('') + (sect==='rekrut'?`<button class="btn-sm" onclick="go('#/tetapan')">⚙︎</button>`:'');
  window.scrollTo(0,0);
  if(sect!=='rekrut') return APA.route(h.slice(2).split('/'));
  if(ROLE==='agent') return go('#/apa');
  if(view==='baru') return viewForm();
  if(view==='edit') return viewForm(id);
  if(view==='calon') return viewProfile(id);
  if(view==='disc') return viewQuiz(id);
  if(view==='tetapan') return viewSettings();
  if(view==='hantar') return viewHantar(id);
  if(view==='tampal') return viewTampal();
  return viewList();
}
window.addEventListener('hashchange', route);
$('#app').innerHTML='<div class="card empty muted">Memuatkan…</div>';
DB.init(()=>{ const v=(location.hash||'#/').split('/')[1]; if(!v||v==='calon'||v==='tetapan') route(); })
  .then(async ctx=>{ ROLE = ctx.role; await APA.init(ctx); route(); });
</script>

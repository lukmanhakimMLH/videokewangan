<!doctype html>
<html
  lang="ms"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"gold","type":"color","label":"Gold","default":"#F5C451"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b0806;
        --gold: #f5c451;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        background: var(--ground);
      }
      #stage {
        position: absolute;
        inset: 0;
        transform-origin: 50% 42%;
      }
      #bgcam {
        position: absolute;
        inset: 0;
      }
      #stage img,
      #stage video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      #backlight {
        position: absolute;
        left: 90px;
        top: 360px;
        width: 900px;
        height: 1100px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 40%, rgba(255, 176, 96, 0.38) 0%, rgba(255, 150, 70, 0.12) 45%, rgba(0, 0, 0, 0) 70%);
      }
      .fx {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
        opacity: 0;
      }
      #fx-sad {
        background: #1d2f55;
        mix-blend-mode: color;
        z-index: 4;
      }
      #fx-red {
        background: radial-gradient(ellipse at 50% 42%, rgba(255, 0, 0, 0) 40%, rgba(255, 30, 30, 0.6) 100%);
        z-index: 4;
      }
      #fx-flash {
        background: #ffffff;
        z-index: 9;
      }
      #fx-gold {
        background: radial-gradient(ellipse at 50% 40%, rgba(255, 214, 120, 0.7) 0%, rgba(255, 190, 90, 0.2) 50%, rgba(0, 0, 0, 0) 80%);
        mix-blend-mode: screen;
        z-index: 9;
      }
      #fx-redflash {
        background: #ff2a2a;
        mix-blend-mode: screen;
        z-index: 9;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="72" data-width="1080" data-height="1920">
      <div id="stage">
        <!-- Studio set (owned artwork, see src3/studio.html) -->
        <div id="bgcam">
          <img id="studio" class="clip" src="assets/studio_bg.png" alt="" data-start="0" data-duration="72" data-track-index="0" style="z-index: 0" />
        </div>
        <div id="backlight"></div>
        <!-- Speaker, matted out of the car (watermarks removed, unmirrored, cut tight: src3/edl.json) -->
        <video
          id="speaker"
          class="clip"
          src="assets/cutout.webm"
          data-start="0"
          data-duration="70.54"
          data-track-index="1"
          muted
          playsinline
          style="z-index: 2"
        ></video>
        <img id="speaker-hold" class="clip" src="assets/cutout_last.png" alt="" data-start="70.54" data-duration="1.46" data-track-index="1" style="z-index: 2" />
        <img id="mic" class="clip" src="assets/mic.png" alt="" data-start="0" data-duration="72" data-track-index="2" style="z-index: 3" />
      </div>

      <div id="fx-sad" class="fx"></div>
      <div id="fx-red" class="fx"></div>
      <div id="fx-flash" class="fx"></div>
      <div id="fx-gold" class="fx"></div>
      <div id="fx-redflash" class="fx"></div>

      <div id="hook" class="scene" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="6.69" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>
      <div id="burger" class="scene" data-composition-id="burger" data-composition-src="compositions/burger.html" data-start="6.69" data-duration="15.35" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>
      <div id="define" class="scene" data-composition-id="define" data-composition-src="compositions/define.html" data-start="22.04" data-duration="9.4" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>
      <div id="dividend" class="scene" data-composition-id="dividend" data-composition-src="compositions/dividend.html" data-start="31.44" data-duration="13.27" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>
      <div id="risk" class="scene" data-composition-id="risk" data-composition-src="compositions/risk.html" data-start="44.71" data-duration="11.59" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>
      <div id="recap" class="scene" data-composition-id="recap" data-composition-src="compositions/recap.html" data-start="56.3" data-duration="8.06" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>
      <div id="cta" class="scene" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="64.36" data-duration="7.64" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>
      <div id="captions" class="scene" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="70.54" data-track-index="4" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 7"></div>

      <!-- Voice (cleaned, cut tight) -->
      <audio id="voice" class="clip" src="assets/voice.m4a" data-start="0" data-duration="70.54" data-track-index="5" data-volume="1" data-fade-out="0.1"></audio>

      <!-- Sound effects: peaks land one frame after their picture -->
      <audio id="sfx-hook" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0" data-duration="2.1" data-track-index="6" data-volume="0.5"></audio>
      <audio id="sfx-jawab" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="3.45" data-duration="0.57" data-track-index="7" data-volume="0.4"></audio>
      <audio id="sfx-pill" class="clip" src="assets/sfx/pop.mp3" data-start="4.64" data-duration="0.7" data-track-index="7" data-volume="0.55"></audio>
      <audio id="sfx-shop" class="clip" src="assets/sfx/whoosh.mp3" data-start="9.66" data-duration="0.57" data-track-index="7" data-volume="0.45"></audio>
      <audio id="sfx-friend" class="clip" src="assets/sfx/pop.mp3" data-start="12.68" data-duration="0.7" data-track-index="7" data-volume="0.55"></audio>
      <audio id="sfx-you" class="clip" src="assets/sfx/pop.mp3" data-start="17.02" data-duration="0.7" data-track-index="8" data-volume="0.55"></audio>
      <audio id="sfx-owner" class="clip" src="assets/sfx/sparkle.mp3" data-start="19.5" data-duration="1.8" data-track-index="7" data-volume="0.35"></audio>
      <audio id="sfx-saham" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="23.57" data-duration="2.1" data-track-index="6" data-volume="0.4"></audio>
      <audio id="sfx-pie" class="clip" src="assets/sfx/pop.mp3" data-start="28.0" data-duration="0.7" data-track-index="7" data-volume="0.5"></audio>
      <audio id="sfx-untung1" class="clip" src="assets/sfx/sparkle.mp3" data-start="30.7" data-duration="1.8" data-track-index="7" data-volume="0.4"></audio>
      <audio id="sfx-coins" class="clip" src="assets/sfx/pop.mp3" data-start="31.92" data-duration="0.7" data-track-index="8" data-volume="0.5"></audio>
      <audio id="sfx-split" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="34.4" data-duration="0.57" data-track-index="7" data-volume="0.4"></audio>
      <audio id="sfx-dividen" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="36.95" data-duration="2.1" data-track-index="6" data-volume="0.45"></audio>
      <audio id="sfx-dividen-shine" class="clip" src="assets/sfx/sparkle.mp3" data-start="37.05" data-duration="1.8" data-track-index="8" data-volume="0.3"></audio>
      <audio id="sfx-stars" class="clip" src="assets/sfx/pop.mp3" data-start="40.62" data-duration="0.7" data-track-index="7" data-volume="0.5"></audio>
      <audio id="sfx-price" class="clip" src="assets/sfx/pop.mp3" data-start="44.02" data-duration="0.7" data-track-index="8" data-volume="0.55"></audio>
      <audio id="sfx-untung2" class="clip" src="assets/sfx/sparkle.mp3" data-start="45.8" data-duration="1.8" data-track-index="7" data-volume="0.4"></audio>
      <audio id="sfx-rugi" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="48.22" data-duration="2.1" data-track-index="6" data-volume="0.5"></audio>
      <audio id="sfx-rugi-glitch" class="clip" src="assets/sfx/glitch-1.mp3" data-start="47.8" data-duration="2.6" data-track-index="8" data-volume="0.28"></audio>
      <audio id="sfx-jatuh" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="49.9" data-duration="2.59" data-track-index="7" data-volume="0.45"></audio>
      <audio id="sfx-risiko" class="clip" src="assets/sfx/whoosh.mp3" data-start="52.84" data-duration="0.57" data-track-index="8" data-volume="0.4"></audio>
      <audio id="sfx-stamp" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="54.58" data-duration="2.1" data-track-index="6" data-volume="0.45"></audio>
      <audio id="sfx-quote" class="clip" src="assets/sfx/pop.mp3" data-start="57.88" data-duration="0.7" data-track-index="7" data-volume="0.55"></audio>
      <audio id="sfx-hakmilik" class="clip" src="assets/sfx/pop.mp3" data-start="60.56" data-duration="0.7" data-track-index="8" data-volume="0.55"></audio>
      <audio id="sfx-simple" class="clip" src="assets/sfx/sparkle.mp3" data-start="63.1" data-duration="1.8" data-track-index="7" data-volume="0.4"></audio>
      <audio id="sfx-cds" class="clip" src="assets/sfx/whoosh.mp3" data-start="66.32" data-duration="0.57" data-track-index="8" data-volume="0.4"></audio>
      <audio id="sfx-dah" class="clip" src="assets/sfx/pop.mp3" data-start="67.52" data-duration="0.7" data-track-index="7" data-volume="0.55"></audio>
      <audio id="sfx-belum" class="clip" src="assets/sfx/notification.mp3" data-start="68.96" data-duration="2.4" data-track-index="8" data-volume="0.35"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const shake = (t, amp = 1) =>
        tl.fromTo(
          "#stage",
          { x: 0, rotation: 0 },
          {
            keyframes: [
              { x: -16 * amp, rotation: -0.7 * amp, duration: 0.04 },
              { x: 14 * amp, rotation: 0.6 * amp, duration: 0.04 },
              { x: -9 * amp, rotation: -0.35 * amp, duration: 0.04 },
              { x: 5 * amp, rotation: 0.2 * amp, duration: 0.04 },
              { x: 0, rotation: 0, duration: 0.05 },
            ],
          },
          t,
        );
      const flash = (sel, t, peak = 0.8, hold = 0.3) =>
        tl.fromTo(sel, { opacity: 0 }, { keyframes: [{ opacity: peak, duration: 0.05 }, { opacity: 0, duration: hold, ease: "power2.out" }] }, t);
      const punch = (t, s, d = 0.12) => tl.to("#stage", { scale: s, duration: d, ease: "power4.out" }, t);
      const cut = (t, s) => tl.set("#stage", { scale: s }, t);

      // The studio drifts slowly the whole time (parallax against the speaker)
      tl.fromTo("#bgcam", { scale: 1.04, x: -12 }, { scale: 1.1, x: 12, duration: 72, ease: "none" }, 0);

      // Hook
      tl.fromTo("#stage", { scale: 1.22 }, { scale: 1, duration: 0.6, ease: "expo.out" }, 0);
      punch(3.6, 1.15);
      shake(3.6, 0.6);
      cut(4.24, 1);
      // Burger story
      cut(6.69, 1.05);
      tl.to("#stage", { scale: 1.12, duration: 1.7, ease: "power1.inOut" }, 6.75);
      cut(8.46, 1);
      punch(11.25, 1.1);
      cut(13.91, 1);
      punch(17.15, 1.1);
      tl.to("#stage", { scale: 1.18, duration: 2.4, ease: "power1.inOut" }, 19.55);
      flash("#fx-gold", 19.55, 0.5, 0.5);
      // Definition
      cut(22.04, 1);
      punch(23.71, 1.12);
      cut(26.0, 1.04);
      punch(30.79, 1.16);
      flash("#fx-gold", 30.79, 0.6, 0.5);
      // Dividend
      cut(31.44, 1);
      punch(37.05, 1.16);
      flash("#fx-gold", 37.05, 0.65, 0.6);
      cut(38.1, 1);
      punch(44.15, 1.1);
      // Gain, then the risk turns
      cut(44.71, 1);
      flash("#fx-gold", 45.89, 0.5, 0.45);
      punch(48.29, 1.3);
      shake(48.29, 1.2);
      flash("#fx-redflash", 48.29, 0.5);
      tl.fromTo("#fx-red", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 48.29);
      shake(49.87, 0.9);
      cut(50.43, 1.15);
      // "jatuh": the frame drops
      tl.to("#stage", { y: 60, scale: 1.25, duration: 0.12, ease: "power4.in" }, 51.89);
      shake(52.0, 1);
      flash("#fx-redflash", 51.89, 0.55);
      tl.to("#fx-red", { opacity: 0, duration: 0.3 }, 52.3);
      cut(52.36, 1);
      tl.set("#stage", { y: 0 }, 52.36);
      // "itulah risiko dia" — sobering beat
      tl.fromTo("#fx-sad", { opacity: 0 }, { opacity: 0.7, duration: 0.25 }, 52.4);
      tl.to("#fx-sad", { opacity: 0, duration: 0.3 }, 54.2);
      punch(54.38, 1.12);
      // Recap
      cut(56.3, 1);
      tl.to("#stage", { scale: 1.08, duration: 6, ease: "none" }, 56.4);
      punch(63.14, 1.22, 0.15);
      flash("#fx-gold", 63.14, 0.45, 0.45);
      // CTA
      cut(64.36, 1);
      cut(67.35, 1.06);
      tl.to("#stage", { scale: 1.12, duration: 4.6, ease: "none" }, 67.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

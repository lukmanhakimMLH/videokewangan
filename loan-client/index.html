<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Klien Loan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Klien Loan</title>
<style>
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#141b2b; --muted:#5f6b80; --line:#dde2ec;
  --brand:#1d4ed8; --brand-ink:#fff; --brand-soft:#e5ecfc; --chip:#eef1f6;
  --pos:#15803d; --neg:#c0392b; --warn:#b26a00; --wa:#1fa855;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1119; --card:#161c28; --ink:#e6ebf4; --muted:#98a3b8; --line:#273044;
    --brand:#6b93f5; --brand-ink:#0b1020; --brand-soft:#1c2740; --chip:#1e2638;
    --pos:#4fd18b; --neg:#ff7b6b; --warn:#f0b04a; --wa:#34c46e; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:transparent;color:inherit;border:1px solid currentColor}
nav.tabs{display:flex;gap:2px;padding:8px 10px;overflow-x:auto;scrollbar-width:none;background:var(--card);border-bottom:1px solid var(--line)}
nav.tabs button{background:transparent;border:0;color:var(--muted);padding:8px 4px;border-radius:8px;white-space:nowrap;flex:1 0 auto;justify-content:center;font-size:13px}
nav.tabs button.on{background:var(--brand-soft);color:var(--brand)}
main{max-width:760px;margin:0 auto;padding:16px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
button,.btn{font:inherit;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:disabled{opacity:.5;cursor:default}
button.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
button.wa{background:var(--wa);border-color:var(--wa);color:#fff}
button.danger{color:var(--neg);border-color:var(--neg);background:transparent}
button.sm,.btn.sm{padding:5px 10px;font-size:13px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px;font-weight:600}
h2{font-size:16px;margin:0 0 6px}
.muted{color:var(--muted)} .small{font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips button{flex:none;border-radius:999px;padding:6px 12px;font-size:13px;background:var(--chip);border-color:transparent;color:var(--ink)}
.chips button.on{background:var(--brand);color:var(--brand-ink)}
.chips button.need{background:#dcf5e6;color:#11763a}
.chips button.need.on{background:var(--wa);color:#fff}
.client{display:flex;align-items:center;gap:12px;cursor:pointer;padding:12px 14px}
.client:hover{border-color:var(--brand)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none;position:relative}
.avatar .dot{position:absolute;right:-2px;top:-2px;width:12px;height:12px;border-radius:50%;background:var(--wa);border:2px solid var(--card)}
.client .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client .info{flex:1;min-width:0}
.st{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--chip);color:var(--muted)}
.wt{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-top:4px}
.wt.yes{background:#dcf5e6;color:#11763a} .wt.no{background:#fff2d9;color:#8a5300}
@media (prefers-color-scheme: dark){.wt.yes{background:#11331f;color:#6fe0a0}.wt.no{background:#3a2a0e;color:#f5c26b}}
.wabar{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.wabar.done{background:#dcf5e6;color:#11763a}
@media (prefers-color-scheme: dark){.wabar.done{background:#11331f;color:#6fe0a0}}
.stg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.stg button{justify-content:center;font-size:13px;padding:8px 6px;text-align:center}
.stg button.on.ap{background:var(--pos);border-color:var(--pos);color:#fff}
.stg button.on.pr{background:var(--warn);border-color:var(--warn);color:#fff}
.stg button.cx{color:var(--neg)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:17px;font-weight:700;white-space:nowrap}
.comm{display:flex;gap:8px;align-items:center;margin-top:10px}
.comm input{flex:1;min-width:0}
.paid{background:var(--pos);border-color:var(--pos);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted)}
.tpl-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:8px}
.tpl-pick button{justify-content:flex-start;font-size:13px;padding:8px 10px}
.tpl-pick button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.tl{border-left:2px solid var(--line);margin-left:4px;padding-left:12px}
.tl .it{margin-bottom:12px;font-size:14px}
.tl .it .h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tl .it .t{white-space:pre-wrap;margin-top:3px}
.pre{white-space:pre-wrap;font-size:13px;background:var(--bg);border-radius:10px;padding:10px;max-height:320px;overflow:auto}
details summary{cursor:pointer;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.bar{height:4px;background:var(--brand-soft);border-radius:4px;overflow:hidden;margin-top:6px}
.bar div{height:100%;background:var(--brand);width:0;transition:width .2s}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw}
#toast.show{opacity:1}
code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:13px}
</style>
</head>
<body>
<header>
  <button class="sm" id="backBtn" style="display:none" onclick="go('list')">←</button>
  <h1 id="title">Klien Loan</h1>
  <button class="sm" id="syncBtn" onclick="sync()">⟳ Sync</button>
</header>
<nav class="tabs" id="tabs">
  <button data-t="list" class="on" onclick="go('list')">Klien</button>
  <button data-t="layak" onclick="go('layak')">Case Layak</button>
  <button data-t="tpl" onclick="go('tpl')">Template</button>
  <button data-t="set" onclick="go('set')">Tetapan</button>
  <button data-t="komisen" onclick="go('komisen')">Komisen</button>
</nav>
<div id="syncBar" style="display:none;padding:6px 16px;background:var(--card);border-bottom:1px solid var(--line)" class="small"><span id="syncTxt"></span><div class="bar"><div id="syncPct"></div></div></div>
<main id="app"></main>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none">

<script>
// ===== ejenplus (Supabase) =====
const SB='https://zpryhnhsmxrxwmybcqyt.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwcnlobmhzbXhyeHdteWJjcXl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5MjMyNzksImV4cCI6MjA3ODQ5OTI3OX0.5PBRGD99pGDyF7abqin6cyFywU3u6a-hL6H0urhDKVc';
const EJ='https://agent.ejenplus.com/orders/';

// ===== Template asal =====
const DEFAULT_TPL=[
  {id:'taklayak',nm:'Tak layak',labels:['Case Tak Layak','Tidak Berjaya Panel','Loan Reject'],txt:`Salam {nama},

Terima kasih sebab percaya dengan saya untuk semak kes {nama}. Selepas semakan pihak HQ, buat masa ni kes {nama} belum layak diteruskan sebab:
{nota}

Jangan risau, ni bukan muktamad. Bila keadaan dah berubah (contoh komitmen dah berkurang atau rekod CCRIS/CTOS dah bersih), saya boleh tolong semak semula. Ada apa-apa soalan, WhatsApp je saya ya.

{agent}`},
  {id:'layak',nm:'Layak ✅',labels:['Case Layak'],txt:`Salam {nama} 😊

Alhamdulillah, berita baik! Selepas semakan pihak HQ, kes {nama} LAYAK untuk diteruskan ✅

Bila {nama} free untuk saya terangkan langkah seterusnya? Boleh call atau WhatsApp saya.

{agent}`},
  {id:'dokumen',nm:'Minta maklumat / dokumen',labels:['Pending Details/Docs','Checking Q&A'],txt:`Salam {nama},

Pihak HQ sedang semak kes {nama} dan perlukan maklumat / dokumen tambahan:
{nota}

Boleh hantar kepada saya secepat mungkin ya supaya proses tak tertangguh. Terima kasih 🙏

{agent}`},
  {id:'semak',nm:'Dalam semakan',labels:['','Case Review HQ'],txt:`Salam {nama} 😊

Kes {nama} dah saya submit dan sedang disemak oleh pihak HQ. Saya update secepat mungkin bila ada keputusan ya.

{agent}`},
  {id:'proses',nm:'Dalam proses',labels:['Client Proceed - Alif','Client Proceed - Aisyah','Client Proceed - Zaf','Client Proceed HQ','Loan Process'],txt:`Salam {nama},

Kes {nama} sekarang dalam proses ✅ Kalau ada pihak bank / HQ call, tolong angkat ya. Saya akan update dari masa ke semasa.

{agent}`},
  {id:'lulus',nm:'Lulus 🎉',labels:['Loan Approved','Case Close - PAID'],txt:`Tahniah {nama}! 🎉

Kes {nama} telah berjaya diselesaikan. Terima kasih sebab percaya dengan saya 🙏

Kalau ada kawan atau family yang perlukan bantuan yang sama, boleh kenalkan kepada saya ya.

{agent}`},
  {id:'followup',nm:'Follow up',labels:['Pending Response - Client','Client Hold','Case Perlu Hold','Client Request Reduce Fee','Client Not Proceed'],txt:`Salam {nama}, sekadar follow up pasal kes {nama} hari tu. Ada apa-apa yang saya boleh bantu? 😊

{agent}`},
];

// ===== Data =====
const KEY='loanClient.v2';
let DB=load();
function load(){
  let d=null; try{ d=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  d=d||{};
  d.orders=d.orders||{}; d.sent=d.sent||{}; if(!d.sentManual){ d.sent={}; d.sentManual=true; } d.notes=d.notes||{}; d.labels=d.labels||[]; d.stage=d.stage||{}; d.comm=d.comm||{};
  d.tpl=d.tpl||structuredClone(DEFAULT_TPL); d.settings=d.settings||{}; d.session=d.session||null;
  return d;
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){ toast('Gagal simpan (storan penuh?)'); } }

// ===== Helpers =====
const $=id=>document.getElementById(id);
const val=id=>($(id)?.value||'').trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD=s=>s?new Date(s).toLocaleDateString('ms-MY',{day:'numeric',month:'short',year:'numeric'}):'';
const fmtDT=s=>s?new Date(s).toLocaleString('ms-MY',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const cleanPhone=p=>String(p||'').replace(/[^\d+]/g,'');
function waNum(p){ let n=String(p||'').replace(/\D/g,''); if(n.startsWith('0')) n='6'+n; else if(n.startsWith('1')) n='60'+n; return n; }
function toast(m,ms=2000){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms);}
async function copy(txt){ try{ await navigator.clipboard.writeText(txt); toast('Disalin'); }catch(e){ const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Disalin'); } }
const lblName=o=>o.label?.name||'';
const chip=o=>o.label?`<span class="st" style="background:${esc(o.label.bg)};color:${esc(o.label.fg)}">${esc(o.label.name)}</span>`:`<span class="st">Submitted</span>`;
const needWa=o=>(o.labelId||'')!==(DB.sent[o.id]??null);
// Kes tak layak yang dah di-WhatsApp -> Arkib (muncul semula jika HQ tukar label)
const HIDE_LABELS=['Case Tak Layak','Tidak Berjaya Panel','Loan Reject'];
// Semua Case Layak -> terus ke page Case Layak. Client Cancel -> Arkib.
const STAGES={proses:'Tengah Proses Loan',approve:'Approve',cancel:'Client Cancel'};
const stageOf=o=>DB.stage[o.id]?.s||'';
const archived=o=>stageOf(o)==='cancel'||(!stageOf(o)&&HIDE_LABELS.includes(lblName(o))&&!needWa(o));
const inLayak=o=>!archived(o)&&(['proses','approve'].includes(stageOf(o))||lblName(o)==='Case Layak');
const stageTag=o=>{const s=stageOf(o);return s==='approve'?'<span class="wt yes">✅ Approve</span>':s==='proses'?'<span class="wt no">⏳ Tengah Proses</span>':s==='cancel'?'<span class="wt" style="background:var(--chip);color:var(--neg)">✖ Client Cancel</span>':'<span class="wt" style="background:var(--brand-soft);color:var(--brand)">Baru</span>';};
const rmF=n=>'RM'+Number(n||0).toLocaleString('ms-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const numV=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.]/g,''));return isNaN(n)?0:n;};
function setStage(id,st){
  const o=DB.orders[id];
  if(st==='cancel'&&!confirm('Client cancel? Kes '+o.name+' akan dipindah ke Arkib.')) return false;
  if(!st||DB.stage[id]?.s===st) delete DB.stage[id]; else DB.stage[id]={s:st,at:new Date().toISOString()};
  save();
  toast(!DB.stage[id]?'Status dibuang':st==='cancel'?'Client cancel · dipindah ke Arkib':st==='approve'?'Approve ✅ · boleh isi komisen dalam tab Komisen':'Tengah proses loan');
  return true;
}
function stageBtns(o,after){
  const s=stageOf(o);
  return `<div class="stg">
    <button class="${s==='approve'?'on ap':''}" onclick="event.stopPropagation();setStage('${o.id}','approve')&&${after}">✅ Approve</button>
    <button class="${s==='proses'?'on pr':''}" onclick="event.stopPropagation();setStage('${o.id}','proses')&&${after}">⏳ Tengah Proses Loan</button>
    <button class="cx" onclick="event.stopPropagation();setStage('${o.id}','cancel')&&${after}">✖ Client Cancel</button>
  </div>`;
}
const waTag=o=>needWa(o)?'<span class="wt no">Belum WA</span>':'<span class="wt yes">✓ Dah WA</span>';

// ===== API =====
async function sbFetch(path,{body,auth=true,method}={}){
  const h={'apikey':SB_KEY,'Content-Type':'application/json'};
  if(auth){ await ensureToken(); h.Authorization='Bearer '+DB.session.access; }
  const r=await fetch(SB+path,{method:method||(body!==undefined?'POST':'GET'),headers:h,body:body!==undefined?JSON.stringify(body):undefined});
  const t=await r.text(); let j=null; try{ j=t?JSON.parse(t):null; }catch(e){}
  if(!r.ok){ const e=new Error(j?.error_description||j?.msg||j?.message||('HTTP '+r.status)); e.status=r.status; throw e; }
  return j;
}
function setSession(d){
  DB.session=Object.assign(DB.session||{},{access:d.access_token,refresh:d.refresh_token,exp:Date.now()+(d.expires_in||3600)*1000,userId:d.user?.id||DB.session?.userId,email:d.user?.email||DB.session?.email});
  save();
}
async function ensureToken(){
  const s=DB.session; if(!s?.refresh) throw new Error('Belum login ejenplus');
  if(s.access && s.exp-60000>Date.now()) return;
  try{ setSession(await sbFetch('/auth/v1/token?grant_type=refresh_token',{auth:false,body:{refresh_token:s.refresh}})); }
  catch(e){ DB.session.refresh=null; save(); throw new Error('Sesi ejenplus tamat. Sila login semula dalam Tetapan.'); }
}
async function login(email,password){
  setSession(await sbFetch('/auth/v1/token?grant_type=password',{auth:false,body:{email,password}}));
  const roles=await sbFetch(`/rest/v1/user_org_roles?select=agency_id,agent_id,access_status,agencies(name,brand_name)&user_id=eq.${DB.session.userId}&order=created_at.desc`);
  const r=(roles||[]).find(x=>x.agent_id&&x.access_status==='active')||roles?.[0];
  if(!r?.agent_id) throw new Error('Akaun agent tak dijumpai');
  DB.session.agentId=r.agent_id; DB.session.agencyId=r.agency_id; DB.session.agency=r.agencies?.brand_name||r.agencies?.name||'';
  const ag=await sbFetch(`/rest/v1/agents?select=full_name,code,phone&id=eq.${r.agent_id}`);
  if(ag?.[0]){ DB.session.agentName=ag[0].full_name; DB.session.agentCode=ag[0].code;
    if(!DB.settings.agentName) DB.settings.agentName=ag[0].full_name; if(!DB.settings.agentPhone&&ag[0].phone) DB.settings.agentPhone=cleanPhone(ag[0].phone); }
  save();
}
function progress(txt,pct){ $('syncBar').style.display=txt?'':'none'; $('syncTxt').textContent=txt||''; $('syncPct').style.width=(pct||0)+'%'; }
async function pool(items,n,fn){ let i=0; await Promise.all(Array.from({length:n},async()=>{ while(i<items.length){ const it=items[i++]; await fn(it); } })); }

let syncing=false;
async function sync(){
  if(syncing) return;
  if(!DB.session?.refresh){ toast('Login ejenplus dulu'); go('set'); return; }
  syncing=true; $('syncBtn').disabled=true;
  try{
    progress('Ambil senarai submission…',5);
    try{ const lb=await sbFetch('/rest/v1/rpc/get_agency_labels',{body:{p_agency_id:DB.session.agencyId}}); if(Array.isArray(lb)) DB.labels=lb.map(l=>({id:l.id,name:l.label_name,bg:l.label_colour,fg:l.text_colour})); }catch(e){}
    let all=[],off=0;
    while(true){
      const page=await sbFetch('/rest/v1/rpc/get_agent_orders_v2',{body:{p_view_agent_id:DB.session.agentId,p_scope:'self',p_agency_id:DB.session.agencyId,p_status:null,p_search:null,p_date_from:null,p_date_to:null,p_label_id:null,p_limit:500,p_offset:off}});
      all=all.concat(page||[]); if(!page||page.length<500) break; off+=500;
    }
    const seen=new Set();
    for(const x of all){
      seen.add(x.id);
      const o=DB.orders[x.id]||{id:x.id};
      Object.assign(o,{no:x.order_number,name:(x.customer_name||'').trim(),phone:cleanPhone(x.customer_phone),email:x.customer_email,
        product:(x.order_items||[]).map(i=>i.product_name).join(', '),amount:x.total_sales_amount,status:x.status,
        submitted:x.submitted_at||x.created_at,pic:x.pic_snapshot?.display_name||'',labelId:x.label_id||'',
        label:x.labels?{name:x.labels.label_name,bg:x.labels.label_colour,fg:x.labels.text_colour}:null});
      DB.orders[x.id]=o;
    }
    for(const id of Object.keys(DB.orders)) if(!seen.has(id)) delete DB.orders[id];
    // maklumat borang (IC + nota pelanggan) untuk order baru
    const needForm=Object.values(DB.orders).filter(o=>o.form===undefined).map(o=>o.id);
    for(let i=0;i<needForm.length;i+=40){
      progress(`Ambil maklumat pelanggan… ${Math.min(i+40,needForm.length)}/${needForm.length}`,10+40*i/Math.max(needForm.length,1));
      const ch=needForm.slice(i,i+40);
      const rows=await sbFetch(`/rest/v1/order_submissions?select=order_id,form_data,submitted_at&order_id=in.(${ch.join(',')})&order=submitted_at.desc`);
      for(const id of ch) DB.orders[id].form=null;
      for(const r of rows||[]){ const o=DB.orders[r.order_id]; if(o&&!o.form){ const f=r.form_data||{}; o.form={ic:f.ic_number||'',notes:f.additional_notes||'',type:f.client_type||''}; } }
    }
    // update HQ (nota) untuk order yang label berubah
    const needUpd=Object.values(DB.orders).filter(o=>o.labelId&&(o.updLabel!==o.labelId||!o.updates));
    let done=0;
    await pool(needUpd,6,async o=>{
      try{ await fetchUpdates(o); }catch(e){}
      done++; progress(`Ambil nota HQ… ${done}/${needUpd.length}`,50+50*done/Math.max(needUpd.length,1));
    });
    DB.lastSync=new Date().toISOString(); save();
    toast(`Sync siap · ${all.length} kes`,3000);
  }catch(e){ toast('Sync gagal: '+e.message,4000); }
  finally{ syncing=false; $('syncBtn').disabled=false; progress(''); if(view!=='detail') render(); }
}
async function fetchUpdates(o){
  const u=await sbFetch('/rest/v1/rpc/get_order_updates',{body:{p_order_id:o.id}});
  o.updates=(u||[]).map(x=>({at:x.created_at,txt:x.note_text||'',by:x.author?.name||'',lid:x.label_id||x.label?.id||'',lbl:x.label?{name:x.label.label_name,bg:x.label.label_colour,fg:x.label.text_colour}:null}))
    .sort((a,b)=>a.at.localeCompare(b.at));
  o.updLabel=o.labelId;
}
const isUpload=t=>/^Uploaded document/i.test(t||'');
function lastUpdate(o){ const u=(o.updates||[]).filter(x=>x.lid||!isUpload(x.txt)); return u[u.length-1]; }
function hqNote(o){
  const u=(o.updates||[]).filter(x=>x.txt&&!isUpload(x.txt));
  const m=[...u].reverse().find(x=>x.lid&&x.lid===o.labelId)||u[u.length-1];
  return m?.txt||'';
}
function bullets(t){ return String(t||'').split(/\n+/).map(s=>s.replace(/^\s*([-•*·]|\d+[.)])\s*/,'').trim()).filter(s=>s&&!/^[^\p{L}]*(case\s+)?(tidak\s+|tak\s+)?layak[^\p{L}]*$/iu.test(s)).map(s=>'• '+s).join('\n'); }

  $('app').innerHTML=`
  <div class="kpis">

  else list=Object.values(DB.orders).filter(o=>(DB.comm[o.id]||stageOf(o)==='approve')&&(kfilter==='semua'||(kfilter==='dibayar')===!!DB.comm[o.id]?.paid));
  list.sort((a,b)=>(!!DB.comm[a.id]?.paid-!!DB.comm[b.id]?.paid)||(DB.stage[b.id]?.at||'').localeCompare(DB.stage[a.id]?.at||''));

      </div>
      ${c.paid&&c.paidAt?`<div class="small muted" style="margin-top:4px">Dibayar ${fmtD(c.paidAt)}</div>`:''}
    </div>`;}).join(''):`<div class="empty">${q?'Tiada klien dijumpai.':'Belum ada komisen.<br><span class="small">Kes yang ditanda ✅ Approve dalam Case Layak masuk sini. Boleh juga cari mana-mana klien.</span>'}</div>`;

function setComm(id,ch){
  const c=Object.assign(DB.comm[id]||{amt:'',paid:false,paidAt:''},ch);

function fill(txt,o){
  const s=DB.settings;
  const agent=s.sign||[s.agentName,s.agentPhone].filter(Boolean).join('\n');
  const nm=(o.name||'').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
  const short=nm.split(/\s+(bin|binti|bt|bte|b\.|a\/l|a\/p)\s+/i)[0].split(' ').slice(0,2).join(' ');
  const map={nama:short,nama_penuh:nm,no_order:o.no||'',status:lblName(o)||'Submitted',nota:bullets(hqNote(o))||'• (tiada nota dari HQ)',ic:o.form?.ic||'',agent};
  return txt.replace(/\{(\w+)\}/g,(m,k)=>k in map?map[k]:m).replace(/\n{3,}/g,'\n\n').trim();
}
function sendWa(){
  const o=DB.orders[curId], n=waNum(o.phone);
  if(n.length<10){ toast('No. telefon tak sah'); return; }
  window.open('https://wa.me/'+n+'?text='+encodeURIComponent($('msg').value),'_blank');
  setTimeout(()=>toast('Dah hantar? Tekan ✓ Tanda Dah WhatsApp',3500),800);
}
function markSent(on){
  const o=DB.orders[curId]; if(on) DB.sent[o.id]=o.labelId||''; else delete DB.sent[o.id]; save();
  if(on&&archived(o)){ toast('Ditanda dah WhatsApp · dipindah ke Arkib'); go('list'); }
  else if(on&&inLayak(o)){ toast('Ditanda dah WhatsApp · dipindah ke Case Layak'); go('list'); }
  else { toast(on?'Ditanda dah WhatsApp':'Ditanda belum WhatsApp'); rDetail(); }
}

function infoText(o){

function logout(){
  if(!confirm('Log keluar dari ejenplus? Data kes dalam phone ni akan dipadam (template & nota kekal).')) return;
  const tok=DB.session?.access; fetch(SB+'/auth/v1/logout',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+tok}}).catch(()=>{});
  DB.session=null; DB.orders={}; DB.lastSync=null; save(); render();
}
function exportData(){
  const {session,orders,...keep}=DB;
  const blob=new Blob([JSON.stringify(keep,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='klien-loan-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
$('importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{
    try{ const d=JSON.parse(r.result);
      if(d.tpl) DB.tpl=d.tpl; Object.assign(DB.sent,d.sent||{}); Object.assign(DB.notes,d.notes||{}); Object.assign(DB.stage,d.stage||{}); Object.assign(DB.comm,d.comm||{}); if(d.settings) DB.settings=d.settings;
      save(); toast('Backup diimport'); render();
    }catch(err){ toast('Fail tak sah'); }
  }; r.readAsText(f); e.target.value='';
};

render();
// Sync setiap kali app dibuka / kembali ke depan (skip jika baru sync < 1 minit)
function autoSync(){ if(DB.session?.refresh && !syncing && (!DB.lastSync || Date.now()-new Date(DB.lastSync).getTime()>60000)) sync(); }
autoSync();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') autoSync(); });
window.addEventListener('pageshow',e=>{ if(e.persisted) autoSync(); });
if('serviceWorker' in navigator && window.isSecureContext && location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
